!IdentityMap
  components:
  - !ASAGI
      file: material_parameters.nc
      var: data
      parameters: [rho, mu, lambda]
      components: !FunctionMap
        map:
          rho:    return rho/1000;
          mu:     return mu/1000/1000/1000;
          lambda: return lambda/1000/1000/1000;
  - !LayeredModel
      map: !AffineMap
        matrix:
          depth: [0.0, 0.0, 1.0]
        translation:
          depth: 0
      interpolation: linear
      parameters: [rho, mu, lambda]
      nodes:
          3000:    [2.500, 11.654000000, 12.792000000]
          -500:    [2.500, 11.654000000, 12.792000000]
          -2500:   [2.700, 23.569000000, 25.870000000]
          -5000:   [2.800, 38.191000000, 41.918000000]
          -7000:   [2.850, 42.544000000, 46.696000000]
          -11000:  [2.950, 46.665000000, 51.220000000]
          -20000:  [2.950, 47.873000000, 52.545000000]
          -28000:  [3.100, 52.603000000, 57.737000000]
          -32000:  [3.150, 55.686000000, 61.121000000]
          -60000:  [3.260, 62.398000000, 68.489000000]
          -200000: [3.330, 65.942325000, 81.235350000]