Python:
  stage: Python
  needs: []
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_BASE} python3 -m compileall -f ./
  allow_failure: false
  extends:
    - .Tags
    - .Variables
    - .RunOnAnyBranch
    - .BeforeScript

