# To avoid having to repeat hard links to e.g. the containers everywhere, we make them
# available with this include statement
include:
  - .continuous_integration/templates/variables.yml

########################################################
# Define one sub-pipeline per toolchain:
########################################################

GCC:
  extends: .Variables
  stage: Compiler
  variables:
    CC: "gcc"
    CXX: "g++"
    IMAGE_TAG: "${IMAGE_GCC}"
    CONFIGURATION_OPTIONS: "${CONFIGURATION_OPTIONS} \
                            -DWITH_MULTITHREADING=OFF \
                            -DWITH_MPI=OFF"
  trigger:
    include:
      - .continuous_integration/gitlab-exahype2.yml
    strategy: depend
    forward:
      pipeline_variables: true
      yaml_variables: true

