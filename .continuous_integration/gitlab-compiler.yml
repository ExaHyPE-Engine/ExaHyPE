# To avoid having to repeat hard links to e.g. the containers everywhere, we make them
# available with this include statement
include:
  - .continuous_integration/templates/variables.yml

########################################################
# Define one sub-pipeline per toolchain:
########################################################

GCC:
  extends: .Variables
  stage: Compiler
  variables:
    CC: "gcc"
    CXX: "g++"
    IMAGE_TAG: "${IMAGE_GCC}"
    CONFIGURATION_OPTIONS: "${CONFIGURATION_OPTIONS} \
                            -DWITH_MULTITHREADING=no \
                            -DWITH_MPI=OFF"
  trigger:
    include:
      - .continuous_integration/gitlab-jobs.yml
    strategy: depend

GCC_SharedOMP_MPI:
  extends: .Variables
  stage: Compiler
  variables:
    CC: "gcc"
    CXX: "g++"
    IMAGE_TAG: "${IMAGE_GCC}"
    CONFIGURATION_OPTIONS: "${CONFIGURATION_OPTIONS} \
                            -DWITH_MULTITHREADING=omp \
                            -DWITH_MPI=ON"
  trigger:
    include:
      - .continuous_integration/gitlab-jobs.yml
    strategy: depend

