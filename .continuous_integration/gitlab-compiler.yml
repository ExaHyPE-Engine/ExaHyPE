# To avoid having to repeat hard links to e.g. the containers everywhere, we make them
# available with this include statement
include:
  - .continuous_integration/templates/variables.yml

########################################################
# Define one sub-pipeline per toolchain:
########################################################

GCC:
  extends: .Variables
  stage: Compiler
  variables:
    CC: "gcc"
    CXX: "g++"
    IMAGE_TAG: "${IMAGE_GCC}"
    CONFIGURATION_OPTIONS: "-DUSE_CCACHE=OFF \
                            -DENABLE_EXAHYPE=ON \
                            -DENABLE_LOADBALANCING=ON \
                            -DENABLE_BLOCKSTRUCTURED=ON \
                            -DENABLE_CURVI=ON \
                            -DENABLE_SWIFT=ON \
                            -DENABLE_PARTICLES=ON \
                            -DENABLE_MGHYPE=ON \
                            -DENABLE_FINITEELEMENTS=ON \
                            -DWITH_HDF5=ON \
                            -DWITH_NETCDF=ON \
                            -DWITH_EASI=ON \
                            -DWITH_MULTITHREADING=no \
                            -DWITH_MPI=OFF"
  trigger:
    include:
      - .continuous_integration/gitlab-jobs.yml
    strategy: depend

