# To avoid having to repeat hard links to e.g. the containers everywhere, we make them
# available with this include statement
include:
  - .continuous_integration/templates/variables.yml

variables:
  UPSTREAM_PIPELINE_SOURCE: "$CI_PIPELINE_SOURCE"
  UPSTREAM_MR_TARGET_BRANCH: "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
  UPSTREAM_MR_SOURCE_BRANCH: "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
  UPSTREAM_COMMIT_BRANCH: "$CI_COMMIT_BRANCH"

GCC:
  extends: .Variables
  stage: Compiler
  variables:
    CC: "gcc"
    CXX: "g++"
    FC: "gfortran"
    IMAGE_TAG: "${IMAGE_GCC}"
    PARALLEL_LAUNCH: ""
    APPTAINERENV_ASAN_OPTIONS: "detect_leaks=1"
    APPTAINERENV_UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
    EXTRA_CONFIGURATION_OPTIONS: "-DPEANO_WITH_MULTITHREADING=OFF \
                                  -DPEANO_WITH_MPI=OFF \
                                  -DPEANO_WITH_SANITIZER=address+undefined"
  trigger:
    include:
      - .continuous_integration/gitlab-pipeline.yml
    strategy: depend
    forward:
      pipeline_variables: true
      yaml_variables: true

Intel:
  extends: .Variables
  stage: Compiler
  variables:
    CC: "icx"
    CXX: "icpx"
    FC: "ifx"
    IMAGE_TAG: "${IMAGE_INTEL}"
    PARALLEL_LAUNCH: "OMP_NUM_THREADS=${OMP_THREADS} mpirun --bind-to none -np ${MPI_RANKS}"
    EXTRA_CONFIGURATION_OPTIONS: "-DPEANO_WITH_MULTITHREADING=ON \
                                  -DPEANO_WITH_MPI=ON"
  trigger:
    include:
      - .continuous_integration/gitlab-pipeline.yml
    strategy: depend
    forward:
      pipeline_variables: true
      yaml_variables: true

LLVM:
  extends: .Variables
  stage: Compiler
  variables:
    CC: "clang"
    CXX: "clang++"
    FC: "gfortran" # TODO: flang
    IMAGE_TAG: "${IMAGE_LLVM}"
    PARALLEL_LAUNCH: "OMP_NUM_THREADS=${OMP_THREADS} mpirun --bind-to none -np ${MPI_RANKS}"
    APPTAINERENV_ASAN_OPTIONS: "detect_leaks=0"
    APPTAINERENV_UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
    APPTAINERENV_OMPI_MCA_pml: "ob1"
    APPTAINERENV_OMPI_MCA_osc: "^ucx"
    APPTAINERENV_OMPI_MCA_btl: "self,sm,tcp"
    APPTAINERENV_UCX_TLS: "tcp,sm"
    EXTRA_CONFIGURATION_OPTIONS: "-DPEANO_WITH_MULTITHREADING=ON \
                                  -DPEANO_WITH_MPI=ON \
                                  -DPEANO_WITH_SANITIZER=address+undefined"
  trigger:
    include:
      - .continuous_integration/gitlab-pipeline.yml
    strategy: depend
    forward:
      pipeline_variables: true
      yaml_variables: true

NVIDIA:
  extends: .Variables
  stage: Compiler
  variables:
    CC: "nvc"
    CXX: "nvc++"
    FC: "nvfortran"
    IMAGE_TAG: "${IMAGE_NVIDIA}"
    PARALLEL_LAUNCH: "OMP_NUM_THREADS=${OMP_THREADS} mpirun --bind-to none -np ${MPI_RANKS}"
    EXTRA_CONFIGURATION_OPTIONS: "-DPEANO_WITH_MULTITHREADING=ON \
                                  -DPEANO_WITH_MPI=ON"
  trigger:
    include:
      - .continuous_integration/gitlab-pipeline.yml
    strategy: depend
    forward:
      pipeline_variables: true
      yaml_variables: true

AMD:
  extends: .Variables
  stage: Compiler
  variables:
    CC: "amdclang"
    CXX: "amdclang++"
    FC: "flang"
    IMAGE_TAG: "${IMAGE_AMD}"
    PARALLEL_LAUNCH: "OMP_NUM_THREADS=${OMP_THREADS} mpirun --bind-to none -np ${MPI_RANKS}"
    EXTRA_CONFIGURATION_OPTIONS: "-DPEANO_WITH_MULTITHREADING=ON \
                                  -DPEANO_WITH_MPI=ON"
  trigger:
    include:
      - .continuous_integration/gitlab-pipeline.yml
    strategy: depend
    forward:
      pipeline_variables: true
      yaml_variables: true
