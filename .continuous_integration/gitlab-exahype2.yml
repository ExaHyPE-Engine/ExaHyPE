include:
  - .continuous_integration/templates/tags.yml
  - .continuous_integration/templates/variables.yml
  - .continuous_integration/templates/before-script.yml
  - .continuous_integration/templates/run-on.yml

stages:
  - Build
  - Test
  - Tutorials
  - Applications
  - Benchmarks

default:
  interruptible: true

.BeforeScriptSanitiser:
  before_script:
    - !reference [".BeforeScript", "before_script"]
    - python3 .continuous_integration/sanitise_path.py build/CTestTestfile.cmake build/CMakeCache.txt install/PeanoTargets.cmake

Build:
  stage: Build
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} python3 -m compileall -f ./
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "mkdir build; cd build; CC=${CC} CXX=${CXX} cmake .. -GNinja ${CONFIGURATION_OPTIONS} -DCMAKE_INSTALL_PREFIX=../install"
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd build; ninja; ninja install"
    - mv build/src/unittests/CTestTestfile.cmake build/CTestTestfile.cmake
  artifacts:
    paths:
      - ./build/UnitTests*
      - ./build/CTestTestfile.cmake
      - ./install/*
    expire_in: 24 hours
  allow_failure: false
  extends:
    - .Tags
    - .Variables
    - .RunOnDev
    - .BeforeScript
  retry: 0

Unit Tests:
  stage: Test
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd build; ctest --no-compress-output --output-on-failure"
  allow_failure: false
  extends:
    - .Tags
    - .Variables
    - .RunOnDev
    - .BeforeScriptSanitiser
  needs:
    - job: Build
  dependencies:
    - Build
  retry: 0

FV Tracers Tests:
  stage: Test
  parallel:
    matrix:
    - dimensions: [2]
      build_type: [Release]
      precision:  [float, double]
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tests/exahype2/fv-tracers; PYTHONPATH=$CI_PROJECT_DIR/python python3 fv-tracers.py -d $dimensions -m $build_type -pr $precision -md 4"
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tests/exahype2/fv-tracers; OMP_NUM_THREADS=1 ./ExaHyPE;"
  allow_failure: false
  extends:
    - .Tags
    - .Variables
    - .RunOnDev
    - .BeforeScriptSanitiser
  needs:
    - job: Build
  dependencies:
    - Build
  retry: 0

