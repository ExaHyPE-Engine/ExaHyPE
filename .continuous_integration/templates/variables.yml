.Variables:
  variables:
    CI_DEBUG_TRACE: "false"
    # https://docs.gitlab.com/ee/user/project/repository/monorepos/
    # https://docs.gitlab.com/ee/ci/runners/configure_runners.html#git-fetch-extra-flags
    GIT_DEPTH: 1
    GIT_STRATEGY: clone
    GIT_FETCH_EXTRA_FLAGS: "--no-tags"
    # A clone leaves the Git LFS files as pointers. An application job pulls the files it reads.
    GIT_LFS_SKIP_SMUDGE: "1"
    GET_SOURCES_ATTEMPTS: "3"
    ARTIFACT_DOWNLOAD_ATTEMPTS: "3"
    RESTORE_CACHE_ATTEMPTS: "3"
    IMAGE_BASE: "base.sif"
    IMAGE_GCC: "gcc.sif"
    IMAGE_INTEL: "intel.sif"
    IMAGE_LLVM: "llvm.sif"
    IMAGE_NVIDIA: "nvidia.sif"
    IMAGE_AMD: "amd.sif"
    APPTAINER_BINDDIR: "/dine/data/do009/peano"
    APPTAINER_IMAGEDIR: "/dine/data/do009/peano/images"
    MPI_RANKS: "4"
    OMP_THREADS: "4"
    MIN_GRID_LEVELS_PEANO: "2"
    MAX_GRID_LEVELS_PEANO: "3"
    MIN_GRID_LEVELS_HILBERT: "3"
    MAX_GRID_LEVELS_HILBERT: "5"
    DEBUG_MAX_TERMINAL_TIME: "1.0"
    EXTRA_CONFIGURATION_OPTIONS: ""
    CONFIGURATION_OPTIONS: "-DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
                            -DPEANO_WITH_FPE=ON \
                            -DPEANO_WITH_HDF5=ON \
                            -DPEANO_WITH_NETCDF=ON"
