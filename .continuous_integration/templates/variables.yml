.Variables:
  variables:
    CI_DEBUG_TRACE: "false"
    # https://docs.gitlab.com/ee/user/project/repository/monorepos/
    # https://docs.gitlab.com/ee/ci/runners/configure_runners.html#git-fetch-extra-flags
    GIT_DEPTH: 1
    GIT_STRATEGY: clone # fetch
    GIT_FETCH_EXTRA_FLAGS: "--no-tags"
    IMAGE_BASE: "base.sif"
    IMAGE_GCC: "gcc.sif"
    IMAGE_INTEL: "intel.sif"
    IMAGE_LLVM: "llvm.sif"
    IMAGE_NVIDIA: "nvidia.sif"
    IMAGE_AMD: "amd.sif"
    APPTAINER_BINDDIR: "/dine/data/do009/peano"
    APPTAINER_IMAGEDIR: "/dine/data/do009/peano/images"
    CONFIGURATION_OPTIONS: "-DUSE_CCACHE=OFF \
                            -DENABLE_EXTENSION_EXAHYPE=ON \
                            -DENABLE_EXTENSION_SWIFT=ON \
                            -DENABLE_EXTENSION_MGHYPE=ON \
                            -DENABLE_TOOLBOX_LOADBALANCING=ON \
                            -DENABLE_TOOLBOX_BLOCKSTRUCTURED=ON \
                            -DENABLE_TOOLBOX_PARTICLES=ON \
                            -DENABLE_TOOLBOX_CURVI=ON \
                            -DWITH_HDF5=ON \
                            -DWITH_NETCDF=ON \
                            -DWITH_EASI=ON"
