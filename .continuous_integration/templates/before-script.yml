.BeforeScript:
  before_script:
    - echo "Running CI with $(nproc) cores"
    - git --version
    - echo "project=$CI_PROJECT_DIR commit=$CI_COMMIT_SHA branch=$CI_COMMIT_BRANCH"
    - echo "container_bind=$APPTAINER_BINDDIR container_image_dir=$APPTAINER_IMAGEDIR"
    - echo "cc=$CC cxx=$CXX"
    - echo "cflags=$CFLAGS"
    - echo "cxxflags=$CXXFLAGS"
    - echo "ldflags=$LDFLAGS"
    - echo "cmake_options=$CONFIGURATION_OPTIONS"
    - echo "parallel_launch=$PARALLEL_LAUNCH"
