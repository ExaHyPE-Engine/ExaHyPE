.ExaHyPE2_FV_Tests:
  parallel:
    matrix:
    - dimensions: [2, 3]
      build_type: [Debug, Release]
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tests/exahype2/fv; PYTHONPATH=$CI_PROJECT_DIR/python python3 fv.py -d $dimensions -m $build_type;"

.ExaHyPE2_ADERDG_Tests:
  parallel:
    matrix:
    - scenario: [AcousticPlanarWaves, AdvectionLinear, ElasticPlanarWaves, EulerGaussianBell, EulerIsotropicVortex, SWERadialDamBreak, SWERestingLake]
      build_type: [Debug, Release]
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tests/exahype2/aderdg; PYTHONPATH=$CI_PROJECT_DIR/python python3 aderdg.py -s $scenario -m $build_type -md 2;"
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tests/exahype2/aderdg; OMP_NUM_THREADS=1 ./ADERDG;"

