.RunOnAnyBranch:
  rules:
    # GitLab stores the source branch in a different variable for each pipeline entry point.
    - if: '$CI_COMMIT_BRANCH =~ /^muc\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^muc\//'
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline" && $UPSTREAM_MR_SOURCE_BRANCH =~ /^muc\//'

.RunOnlyOnMainBranch:
  rules:
    # Full validation follows merge requests through child pipelines regardless of their target branch.
    - if: '$CI_COMMIT_BRANCH == "muc/exahype"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline" && $UPSTREAM_PIPELINE_SOURCE == "merge_request_event"'
