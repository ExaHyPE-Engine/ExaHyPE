include:
  - .continuous_integration/templates/tags.yml
  - .continuous_integration/templates/variables.yml
  - .continuous_integration/templates/before-script.yml

pages:
  extends:
    - .Tags
    - .Variables
    - .BeforeScript
  stage: Pages
  allow_failure: true
  needs: []
  dependencies: []
  script:
    - |
      apptainer exec \
        --env GITHUB_USERNAME="$GITHUB_USERNAME" \
        --env GITHUB_EMAIL="$GITHUB_EMAIL" \
        --env GITHUB_TOKEN="$GITHUB_TOKEN" \
        -e --bind "$PWD" $APPTAINER_IMAGEDIR/${IMAGE_GCC} /bin/bash -c '
        set -e
        python3 documentation/convert-jupyter-notebooks.py
        doxygen documentation/Doxyfile > /dev/null 2>&1

        mkdir ExaHyPE-Documentation && cd ExaHyPE-Documentation
        git init
        git checkout --orphan gh-pages
        mv ../doxygen-html/html/* ./

        git config user.name "$GITHUB_USERNAME"
        git config user.email "$GITHUB_EMAIL"

        git add .
        git commit -q -m "Update HTML documentation from CI" > /dev/null 2>&1
        git push --force https://$GITHUB_USERNAME:$GITHUB_TOKEN@github.com/TUM-I5/ExaHyPE-Documentation.git gh-pages
      '
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "muc/exahype"'
  when: always
  retry: 0
