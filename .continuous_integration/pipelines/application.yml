ExaSkred Tsunami:
  stage: Application
  parallel:
    matrix:
    - scenario: [artificial, chile, oscillating-lake, solitary-wave, three-mounds-channel, tohoku]
      build_type: [Release, Asserts, Debug]
  script:
    - git lfs pull --include="applications/exaskred/tsunami/$scenario/**"
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd applications/exaskred/tsunami/$scenario && PYTHONPATH=$CI_PROJECT_DIR/api python3 $scenario.py --build-mode $build_type"
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd applications/exaskred/tsunami/$scenario && $PARALLEL_LAUNCH ./ExaSkred-Tsunami -ns 0 -lmin ${MIN_GRID_LEVELS} -lmax ${MAX_GRID_LEVELS}"
  allow_failure: false
  extends:
    - .Tags
    - .Variables
    - .RunOnlyOnMainBranch
    - .BeforeScriptSanitiser
  needs:
    - job: Build

