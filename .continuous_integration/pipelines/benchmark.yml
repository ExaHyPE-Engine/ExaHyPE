FV Kernels:
  stage: Benchmark
  parallel:
    matrix:
    - build_type: [Release, Debug]
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd benchmarks/kernel-benchmarks/fv; PYTHONPATH=$CI_PROJECT_DIR/python python3 fv.py -m $build_type -md ${MIN_GRID_LEVELS}; ./KernelBenchmarks"
  allow_failure: false
  extends:
    - .Tags
    - .Variables
    - .RunOnlyOnMain
    - .BeforeScriptSanitiser
  needs:
    - job: Build
  retry: 0

