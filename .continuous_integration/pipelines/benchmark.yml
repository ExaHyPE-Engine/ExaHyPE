FV Kernels:
  stage: Benchmark
  parallel:
    matrix:
    - build_type: [Release, Debug]
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd benchmarks/kernel-benchmarks/fv && PYTHONPATH=$CI_PROJECT_DIR/api python3 fv.py --build-mode $build_type && ./KernelBenchmarks -ns 0 -lmin ${MIN_GRID_LEVELS} -lmax ${MIN_GRID_LEVELS}"
  allow_failure: false
  extends:
    - .Tags
    - .Variables
    - .RunOnlyOnMain
    - .BeforeScriptSanitiser
  needs:
    - job: Build

ADERDG Kernels:
  stage: Benchmark
  parallel:
    matrix:
    - build_type: [Release, Debug]
  script:
