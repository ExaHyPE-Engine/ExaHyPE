Plotter IO:
  stage: Benchmark
  parallel:
    matrix:
    - build_type: [Release]
      dimensions: [2, 3]
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd benchmarks/plotter && PYTHONPATH=$CI_PROJECT_DIR/api python3 plotter.py --build-mode $build_type --dimensions $dimensions && $PARALLEL_LAUNCH ./PlotterBenchmark"
  allow_failure: false
  extends:
    - .Tags
    - .Variables
    - .RunOnlyOnMain
    - .BeforeScriptSanitiser
  needs:
    - job: Build
