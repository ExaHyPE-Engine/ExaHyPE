Postprocessing:
  stage: Test
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "python3 -m unittest discover -s postprocessing/tests -t ."
  allow_failure: false
  extends:
    - .Tags
    - .Variables
    - .RunOnAnyBranch
    - .BeforeScriptSanitiser
  needs:
    - job: Build

FV:
  stage: Test
  parallel:
    matrix:
    - scenario: [breaking-dam, channel-flow, dry-ring, gaussian-bell, gaussian-explosion, isothermal-stratification, point-explosion, smooth-convergence, taylor-green-vortex]
      dimensions: [2]
      build_type: [Release, Asserts, Debug]
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tests/fv && PYTHONPATH=$CI_PROJECT_DIR/api python3 $scenario.py --dimensions $dimensions --build-mode $build_type"
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tests/fv && $PARALLEL_LAUNCH ./ExaHyPE -ns 0 -lmin ${MIN_GRID_LEVELS} -lmax ${MAX_GRID_LEVELS}"
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tests/fv && { [ $scenario != gaussian-bell ] || PYTHONPATH=$CI_PROJECT_DIR python3 -m postprocessing.check_error_norms GaussianBell.output/Error.csv 8e-3; }"
  allow_failure: false
  extends:
    - .Tags
    - .Variables
    - .RunOnAnyBranch
    - .BeforeScriptSanitiser
  needs:
    - job: Build

FV Tracers:
  stage: Test
  parallel:
    matrix:
    - test: [fv-tracers-advection, fv-tracers-periodic-advection, fv-tracers-circular-bubble, fv-tracers-drag-force-validation, fv-tracers-vertical-plume-rise, fv-tracers-one-body-problem, fv-tracers-radial-jet, fv-tracers-volcanic-plume-rise]
