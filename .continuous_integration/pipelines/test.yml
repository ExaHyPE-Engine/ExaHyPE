Spacetree:
  stage: Test
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tests/spacetree && PYTHONPATH=$CI_PROJECT_DIR/python python3 spacetree.py"
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tests/spacetree && ./Spacetree"
  allow_failure: false
  extends:
    - .Tags
    - .Variables
    - .RunOnDev
    - .BeforeScriptSanitiser
  needs:
    - job: Build
  retry: 0

