FV Static AMR:
  stage: Test
  parallel:
    matrix:
    - periodic: ["on", "off"]
      dimensions: [2]
      build_type: [Release, Asserts, Debug]
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tests/fv-static-amr && PYTHONPATH=$CI_PROJECT_DIR/api python3 fv-static-amr.py --periodic-bc $periodic --dimensions $dimensions --build-mode $build_type"
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tests/fv-static-amr && $PARALLEL_LAUNCH ./ExaHyPE -ns 0 -lmin ${MIN_GRID_LEVELS} -lmax ${MAX_GRID_LEVELS}"
  allow_failure: false
  extends:
    - .Tags
    - .Variables
    - .RunOnlyOnMainBranch
    - .BeforeScriptSanitiser
  needs:
    - job: Build

Dynamic AMR:
  stage: Test
  parallel:
    matrix:
    - solver: [fv]
      test: [acoustic-point-explosion, euler-point-explosion, freestream, periodic-advection, radial-advection]
      dimensions: [2]
      build_type: [Release, Asserts, Debug]
    - solver: [aderdg, rkdg]
      test: [acoustic-point-explosion, freestream, periodic-advection, radial-advection]
      dimensions: [2]
      build_type: [Release, Asserts, Debug]
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tests/$solver-dynamic-amr && PYTHONPATH=$CI_PROJECT_DIR/api python3 $test.py --dimensions $dimensions --build-mode $build_type"
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tests/$solver-dynamic-amr && $PARALLEL_LAUNCH ./ExaHyPE -ns 0 -lmin ${MIN_GRID_LEVELS} -lmax ${MAX_GRID_LEVELS}"
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tests/$solver-dynamic-amr && { [ $test != freestream ] || PYTHONPATH=$CI_PROJECT_DIR python3 -m postprocessing.check_error_norms FreeStream.output/Error.csv 1e-10; }"
  allow_failure: false
  extends:
    - .Tags
    - .Variables
    - .RunOnlyOnMainBranch
    - .BeforeScriptSanitiser
  needs:
    - job: Build

ADERDG:
  stage: Test
  parallel:
    matrix:
    - scenario: [AdvectionLinear, AcousticPlanarWaves, ElasticPlanarWaves, ElasticRickerPulse, EulerGaussianBell, EulerGaussianBell3D, EulerIsentropicVortex, SWERadialDamBreak, SWERestingLake, SWESteadyVortex, NavierStokesCosineBubble, NavierStokesTwoBubbles, NavierStokesTaylorGreen, NavierStokesABCFlow]
      build_type: [Release, Asserts, Debug]
      precision: [float, double]
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tests/aderdg && PYTHONPATH=$CI_PROJECT_DIR/api python3 aderdg.py -s $scenario --build-mode $build_type -pr $precision"
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tests/aderdg && $PARALLEL_LAUNCH ./ExaHyPE -ns 0 -lmin ${MIN_GRID_LEVELS} -lmax ${MAX_GRID_LEVELS}"
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tests/aderdg && { [ $scenario != EulerGaussianBell ] || [ $precision != double ] || PYTHONPATH=$CI_PROJECT_DIR python3 -m postprocessing.check_error_norms EulerGaussianBell.output/Error_EulerGaussianBell.csv 5e-4; }"
  allow_failure: false
  extends:
    - .Tags
    - .Variables
    - .RunOnAnyBranch
    - .BeforeScriptSanitiser
  needs:
    - job: Build

