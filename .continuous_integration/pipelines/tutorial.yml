Acoustic:
  stage: Tutorial
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tutorials/acoustic; ipython Acoustic.ipynb;"
  allow_failure: false
  extends:
    - .Tags
    - .Variables
    - .RunOnlyOnMain
    - .BeforeScriptSanitiser
  needs:
    - job: Build
  retry: 0

SWE:
  stage: Tutorial
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd documentation/exahype2/tutorials; ipython SWE.ipynb;"
  allow_failure: false
  extends:
    - .Tags
    - .Variables
    - .RunOnlyOnMain
    - .BeforeScriptSanitiser
  needs:
    - job: Build
  retry: 0

Euler:
  stage: Tutorial
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd documentation/exahype2/tutorials; PYTHONPATH=$CI_PROJECT_DIR/python python3 euler.py;"
  allow_failure: false
  extends:
    - .Tags
    - .Variables
    - .RunOnlyOnMain
    - .BeforeScriptSanitiser
  needs:
    - job: Build
  retry: 0
