Acoustic:
  stage: Tutorial
  script:
    - apptainer exec -e --bind "$APPTAINER_BINDDIR" $APPTAINER_IMAGEDIR/${IMAGE_TAG} bash <<< "cd tutorials/01_acoustic && PYTHONPATH=$CI_PROJECT_DIR/python ipython AcousticWaves.ipynb"
  allow_failure: false
  extends:
    - .Tags
    - .Variables
    - .RunOnlyOnMain
    - .BeforeScriptSanitiser
  needs:
    - job: Build

