include:
  - local: .continuous_integration/templates/*.yml
  - local: .continuous_integration/pipelines/*.yml

stages:
  - Build
  - Test
  - Tutorial
  - Application

default:
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
      - api_failure
      - stuck_or_timeout_failure
  hooks:
    # The shell executor reuses one build directory, and a cancelled job leaves
    # git's configuration lock file behind. Delete the lock before the next job
    # fetches the sources.
    pre_get_sources_script:
      - rm -f "${CI_PROJECT_DIR}.tmp/.gitlab-runner.ext.conf.lock" 2>/dev/null || true
