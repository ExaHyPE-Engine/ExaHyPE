spack:
  specs:
    - llvm@19.1.7 +clang +libomptarget +libomptarget_debug +gold targets=all
    - python@3.14.0
    - py-pip@25.1.1
    - cuda@12.9.0
    - hwloc@2.12.2 +cuda
    - ucx@1.19.0 +cuda
    - openmpi@5.0.8 +cuda fabrics=ucx
    - memkind@1.14.0
    - papi@7.2.0
    - likwid@5.4.1
    - metis@5.1.0
    - parmetis@4.0.3
    - petsc@3.22.2 +mpi +memkind +metis +hwloc +openmp
    - hdf5@1.14.6 -fortran -java +threadsafe +mpi +shared +cxx +hl
    - netcdf-c@4.9.2 +mpi +shared
    - parallel-netcdf@1.14.1 +cxx -fortran +pic +shared
  packages:
    all:
      target: [x86_64]
  concretizer:
    unify: true
    reuse: true
  config:
    install_tree:
      root: /opt/software
  view: /opt/views/view
