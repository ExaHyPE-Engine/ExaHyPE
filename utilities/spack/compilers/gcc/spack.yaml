spack:
  specs:
    - group: compiler
      specs:
        - gcc@15.3.0
    - group: main
      needs: [compiler]
      specs:
        - python@3.14.5
        - py-pip@26.2.1
        - cuda@13.4.1
        - hwloc@2.13.0 +cuda
        - ucx@1.22.0 +cuda
        - openmpi@5.0.10 +cuda fabrics=ucx
        - hdf5@1.14.6 -fortran -java +threadsafe +mpi +shared +cxx +hl
        - netcdf-c@4.9.3 +mpi +shared
        - kokkos@5.2.2 +serial ~openmp +cuda +wrapper cuda_arch=75 %cxx=gcc@15.3.0
  packages:
    all:
      target: [x86_64]
  repos:
    builtin::
      git: https://github.com/spack/spack-packages.git
      commit: 093bed090925a0c327ba4fd927f1f1d5e36f2b3e
  concretizer:
    unify: true
    reuse: true
  config:
    install_tree:
      root: /opt/software
  view: /opt/views/view
