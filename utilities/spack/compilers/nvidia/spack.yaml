spack:
  specs:
    - nvhpc@26.9 +mpi
    - python@3.14.5
    - py-pip@26.2.1
    - cuda@13.4.1
    - hdf5@1.14.6 -fortran -java +threadsafe +mpi +shared +cxx +hl
    - netcdf-c@4.9.3 +mpi +shared
  packages:
    all:
      target: [x86_64]
    # HDF5 and NetCDF use the HPC-X Open MPI of the NVIDIA SDK.
    mpi:
      require: nvhpc
  repos:
    builtin::
      git: https://github.com/spack/spack-packages.git
      commit: 093bed090925a0c327ba4fd927f1f1d5e36f2b3e
  concretizer:
    unify: true
    reuse: true
  config:
    install_tree:
      root: /opt/software
  view: /opt/views/view
  # The MPI wrappers of the NVIDIA SDK use the MPI in this folder.
  env_vars:
    set:
      NVCOMPILER_COMM_LIBS_HOME: /opt/views/view/Linux_x86_64/26.9/comm_libs/13.3
