spack:
  specs:
    - group: compiler
      specs:
        - intel-oneapi-compilers@2026.1.1
    - group: main
      needs: [compiler]
      specs:
        - intel-oneapi-mpi@2021.18.0
        - intel-oneapi-mkl@2026.1.0
        - intel-oneapi-tbb@2023.1.0
        - intel-oneapi-vtune@2026.2.0
        - intel-oneapi-advisor@2026.0.0
        - python@3.14.5
        - py-pip@26.2.1
        - hdf5@1.14.6 -fortran -java +threadsafe +mpi +shared +cxx +hl
        - netcdf-c@4.9.3 +mpi +shared
        - kokkos@5.2.2 +serial ~openmp +sycl ~wrapper %cxx=intel-oneapi-compilers@2026.1.1
    - group: acpp
      needs: [main]
      specs:
        - llvm@19.1.7 +clang ~libomptarget ~offload ~lldb ~polly libcxx=none libunwind=none targets=x86
        - adaptivecpp@25.10.0 +level_zero ^llvm@19.1.7 +clang ~libomptarget ~offload ~lldb ~polly libcxx=none libunwind=none targets=x86
  packages:
    all:
      target: [x86_64]
  repos:
    builtin::
      git: https://github.com/spack/spack-packages.git
      commit: 093bed090925a0c327ba4fd927f1f1d5e36f2b3e
  concretizer:
    unify: true
    reuse: true
  config:
    install_tree:
      root: /opt/software
  view:
    default:
      root: /opt/views/view
      group: [compiler, main]
    acpp:
      root: /opt/views/acpp
      group: [acpp]
      link: roots
  env_vars:
    append_path:
      CMAKE_PREFIX_PATH: /opt/views/acpp
