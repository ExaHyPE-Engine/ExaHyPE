spack:
  specs:
    - intel-oneapi-compilers@2025.3.1
    - intel-oneapi-mpi@2021.17.0
    - intel-oneapi-mkl@2024.2.2
    - intel-oneapi-tbb@2022.3.0
    - intel-oneapi-vtune@2025.7.0
    - intel-oneapi-advisor@2025.4.0
    - python@3.14.0
    - py-pip@25.1.1
    - libxsmm@1.17 +generator
    - memkind@1.14.0
    - papi@7.2.0
    - likwid@5.4.1
    - metis@5.1.0
    - parmetis@4.0.3
    - boost@1.88.0 +filesystem +fiber +context
    - petsc@3.22.2 +mpi +memkind +metis +hwloc +openmp
    - hdf5@1.14.6 -fortran -java +threadsafe +mpi +shared +cxx +hl
