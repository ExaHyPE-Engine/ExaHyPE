# Define the stages we have overall.
# Compiler is where we build and test the actual code against different compilers.
# Pages is where we generate the doxygen pages and publish them on the website.
stages:
  - Compiler
#  - Pages

# We define a job within the Compiler or Pages stage.
# We use the include statement so that this job does everything in the .yml file linked below.
# This one contains everything to publish the online documentation.
include:
  - .continuous_integration/gitlab-compiler.yml
#  - .continuous_integration/github-pages.yml
