# Define the stages we have overall.
# Python compiles the Python sources and runs the postprocessing tests once, without a compiler.
# Compiler is where we build and test the actual code against different compilers.
stages:
  - Python
  - Toolchain

workflow:
  rules:
    # Always create pipelines for merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Do not create pipelines for tag pushes
    - if: '$CI_COMMIT_TAG'
      when: never
    # Create pipelines for branch pushes only if there is no open MR for this branch
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS == null'
    # Trigger for child pipelines
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    # Else do not create a pipeline
    - when: never

# Cancelling a superseded trigger job cancels its whole child pipeline, which the
# child's own interruptible default cannot arrange from the inside.
default:
  interruptible: true

# The templates define the tags, variables, scripts and rules the jobs extend.
# gitlab-toolchain.yml defines one job per compiler, gitlab-python.yml the jobs without a compiler.
include:
  - local: .continuous_integration/templates/*.yml
  - local: .continuous_integration/gitlab-python.yml
  - local: .continuous_integration/gitlab-toolchain.yml
