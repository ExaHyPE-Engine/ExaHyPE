stages:
  - Python
  - CPU
  - GPU

workflow:
  rules:
    # A merge request creates a pipeline.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # GitLab skips the pipeline of a tag push.
    - if: '$CI_COMMIT_TAG'
      when: never
    # A branch push creates a pipeline until the branch is the source of an open merge request.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS == null'
    # A trigger job of a parent pipeline creates its child pipeline.
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    # GitLab skips the pipeline of every other event.
    - when: never

# The child pipelines read the source of this pipeline in their rules.
variables:
  UPSTREAM_PIPELINE_SOURCE: "$CI_PIPELINE_SOURCE"
  UPSTREAM_MR_TARGET_BRANCH: "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
  UPSTREAM_MR_SOURCE_BRANCH: "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
  UPSTREAM_COMMIT_BRANCH: "$CI_COMMIT_BRANCH"

# A newer pipeline cancels a superseded trigger job and with it the whole child pipeline. The
# interruptible default of the child pipeline cannot cancel the child pipeline from the inside.
default:
  interruptible: true

include:
  - local: .gitlab/templates.yml
  - local: .gitlab/python.yml
  - local: .gitlab/cpu.yml
  - local: .gitlab/gpu.yml
