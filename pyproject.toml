[project]
name = "Peano"
version = "4.0.0"
description = "Peano Python API"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Tobias Weinzierl", email = "tobias.weinzierl@durham.ac.uk" },
  { name = "Neil Albuquerque" },
  { name = "Sean Baccas" },
  { name = "Cristian Barrera-Hinojosa" },
  { name = "Alexander Belozerov" },
  { name = "Johannes Bockhorst" },
  { name = "Yakup Budanaz" },
  { name = "Dominic Etienne Charrier" },
  { name = "Thomas Flynn" },
  { name = "Jonathan Frawley" },
  { name = "Uzmar Gomez" },
  { name = "Mladen Ivkovic" },
  { name = "Lando Jahn" },
  { name = "Simon Jokel" },
  { name = "Sven Köppel" },
  { name = "Chung Loi" },
  { name = "Marc Marot-Lassauzaie" },
  { name = "Nikita Mashaev" },
  { name = "Eike Mueller" },
  { name = "Daniel Nagy" },
  { name = "Dmitry Nikolaenko" },
  { name = "Miren Radia" },
  { name = "Pawel Radtke" },
  { name = "Anne Reinarz" },
  { name = "Philipp Samfass" },
  { name = "Holger Schulz" },
  { name = "Ujwal Shende" },
  { name = "Timothy Stokes" },
  { name = "Yashas Tejaskumar Gandhi" },
  { name = "Adam Tuft" },
  { name = "Mark Turner" },
  { name = "Marion Weinzierl" },
  { name = "Mario Wille" },
  { name = "Florian Wunderlich" },
  { name = "Han Zhang" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
]
dynamic = ["readme", "dependencies"]

[project.urls]
"Homepage" = "http://www.peano-framework.org"

[project.scripts]
format = "postprocessing.format:main"
plot-probe-data = "postprocessing.plot_probe_data:main"
plot-error-norms = "postprocessing.plot_error_norms:main"
compare-solution = "postprocessing.compare_solution:main"
check-symmetry = "postprocessing.check_symmetry:main"
check-error-norms = "postprocessing.check_error_norms:main"
render-solution = "postprocessing.render_solution:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
readme = { file = ["README.md"], content-type = "text/markdown" }
dependencies = { file = ["requirements.txt"] }
