.GPU:
  extends: .ChildPipeline
  stage: GPU
  needs: []
  variables:
    RUN_UNIT_TESTS: "false"
    RUN_SIMULATIONS: "false"
    EXTRA_CONFIGURATION_OPTIONS: "-DPEANO_WITH_FPE=OFF"

# A GPU job whose kernels also run on a CPU device runs its unit tests and simulations.
.CPUDevice:
  variables:
    RUN_UNIT_TESTS: "true"
    RUN_SIMULATIONS: "true"
  rules:
    - if: $BUILD_MODE != "Release"
      variables:
        RUN_UNIT_TESTS: "false"
        RUN_SIMULATIONS: "false"
    - when: on_success

GCC CUDA:
  extends: [.GPU, .Peano]
  variables:
    TOOLCHAIN: "GCC CUDA"
    CC: "gcc"
    CXX: "g++"
    FC: "gfortran"
    IMAGE_TAG: "${IMAGE_GCC}"
    GPU_BACKEND: "native"
    GPU_ARCH: "sm_75"

GCC Kokkos:
  extends: [.GPU, .Peano]
  variables:
    TOOLCHAIN: "GCC Kokkos"
    CC: "gcc"
    CXX: "nvcc_wrapper"
    FC: "gfortran"
    IMAGE_TAG: "${IMAGE_GCC}"
    GPU_BACKEND: "kokkos"
    GPU_ARCH: "sm_75"

Intel SYCL:
  extends: [.GPU, .Peano, .CPUDevice]
  variables:
    TOOLCHAIN: "Intel SYCL"
    CC: "icx"
    CXX: "icpx"
    FC: "ifx"
    IMAGE_TAG: "${IMAGE_INTEL}"
    GPU_BACKEND: "native"
    GPU_ARCH: "spir64"
    APPTAINERENV_SYCL_CACHE_PERSISTENT: "1"
    APPTAINERENV_SYCL_CACHE_DIR: "$CI_PROJECT_DIR/.sycl-cache"

Intel OpenMP Target:
  extends: [.GPU, .Peano, .CPUDevice]
  variables:
    TOOLCHAIN: "Intel OpenMP Target"
    CC: "icx"
    CXX: "icpx"
    FC: "ifx"
    IMAGE_TAG: "${IMAGE_INTEL}"
    GPU_BACKEND: "ompt"
    GPU_ARCH: "spir64"
    # The OpenMP runtime of oneAPI offloads to the CPU through its OpenCL plugin.
    APPTAINERENV_LIBOMPTARGET_PLUGIN: "OPENCL"
    APPTAINERENV_LIBOMPTARGET_DEVICETYPE: "CPU"

Intel Kokkos:
  extends: [.GPU, .Peano]
  variables:
    TOOLCHAIN: "Intel Kokkos"
    CC: "icx"
    CXX: "icpx"
    FC: "ifx"
    IMAGE_TAG: "${IMAGE_INTEL}"
    GPU_BACKEND: "kokkos"
    GPU_ARCH: "spir64"

Intel AdaptiveCpp:
  extends: [.GPU, .Peano]
  variables:
    TOOLCHAIN: "Intel AdaptiveCpp"
    # The Clang of AdaptiveCpp rejects the flags that CMake chooses for icpx.
    CC: "/opt/views/acpp/bin/clang"
    CXX: "/opt/views/acpp/bin/clang++"
    FC: "ifx"
    IMAGE_TAG: "${IMAGE_INTEL}"
    GPU_BACKEND: "acpp"
    GPU_ARCH: "spir64"

