Python:
  stage: Python
  needs: []
  variables:
    IMAGE_TAG: "${IMAGE_BASE}"
  script:
    - in_image "python3 -m compileall -f ./"
    - in_image "python3 api/exahype2/tests/import_layers.py"
  extends:
    - .Tags
    - .Variables
    - .RunOnAnyBranch
    - .BeforeScript

