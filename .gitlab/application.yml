ExaSkred Tsunami:
  stage: Application
  parallel:
    matrix:
      - scenario: [artificial, chile, oscillating-lake, solitary-wave, three-mounds-channel, tohoku]
  script:
    - git lfs pull --include="applications/exaskred/tsunami/$scenario/**"
    - generate applications/exaskred/tsunami/$scenario "$scenario.py --build-mode $BUILD_MODE"
    - launch applications/exaskred/tsunami/$scenario "./ExaSkred-Tsunami -nt ${NUMBER_OF_TIME_STEPS} -ns ${NUMBER_OF_SNAPSHOTS} -lmin ${MIN_GRID_LEVELS} -lmax ${MAX_GRID_LEVELS}"
  extends: .RunOnlyOnMainBranch
  needs: [Build and Unit Tests]

