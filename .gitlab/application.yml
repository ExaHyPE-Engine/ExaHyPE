ExaSeis:
  stage: Application
  parallel:
    matrix:
      - scenario: [cartesian]
      - scenario: [curvilinear, pml]
        exaseis_scenario: [LOH1, Zugspitze]
      - scenario: [dynamic-rupture, pml-dynamic-rupture]
        exaseis_scenario: [TPV5, TPV6, TPV16, TPV26, TPV28, TPV29, TPV34, Husavik]
  script:
    - if [ -n "${exaseis_scenario:-}" ]; then git lfs pull --include="applications/exaseis/Scenario/specs/$exaseis_scenario/**"; fi
    - generate applications/exaseis/$scenario "$scenario.py ${exaseis_scenario:+-s $exaseis_scenario} --build-mode $BUILD_MODE"
    - launch applications/exaseis/$scenario "./ExaSeis -nt ${NUMBER_OF_TIME_STEPS} -ns ${NUMBER_OF_SNAPSHOTS} -lmin ${MIN_GRID_LEVELS} -lmax ${MAX_GRID_LEVELS}"
  extends: .RunOnlyOnMainBranch
  needs: [Build and Unit Tests]

ExaGRyPE:
  stage: Application
  parallel:
    matrix:
      - scenario: [gauge-wave]
        solver: [fv]
  script:
    - generate applications/exagrype/$scenario "$scenario.py --solver $solver --build-mode $BUILD_MODE"
    - launch applications/exagrype/$scenario "./ExaGRyPE -nt ${NUMBER_OF_TIME_STEPS} -ns ${NUMBER_OF_SNAPSHOTS} -l 1"
  extends: .RunOnlyOnMainBranch
  needs: [Build and Unit Tests]
