Build and Unit Tests:
  stage: Build
  before_script: !reference [".BeforeScript", "before_script"]
  variables:
    APPTAINERENV_CMAKE_C_COMPILER_LAUNCHER: "ccache"
    APPTAINERENV_CMAKE_CXX_COMPILER_LAUNCHER: "ccache"
    APPTAINERENV_CMAKE_CUDA_COMPILER_LAUNCHER: "ccache"
    APPTAINERENV_CMAKE_HIP_COMPILER_LAUNCHER: "ccache"
    APPTAINERENV_CCACHE_DIR: "$CI_PROJECT_DIR/.ccache"
    APPTAINERENV_CCACHE_BASEDIR: "$CI_PROJECT_DIR"
    APPTAINERENV_CCACHE_NOHASHDIR: "true"
    APPTAINERENV_CCACHE_MAXSIZE: "1G"
  cache:
    key: "ccache-$TOOLCHAIN-$BUILD_MODE-$SPACE_FILLING_CURVE"
    paths:
      - .ccache/
    when: always
  script:
    - in_image "mkdir build && cd build && CC=${CC} CXX=${CXX} cmake .. -GNinja -DBUILD_TESTING=ON ${CONFIGURATION_OPTIONS} ${EXTRA_CONFIGURATION_OPTIONS} -DSUPPORTED_BUILD_TYPES=${BUILD_MODE} -DPEANO_WITH_SANITIZER=${SANITIZER} -DPEANO_WITH_SPACE_FILLING_CURVE=${SPACE_FILLING_CURVE} -DPEANO_WITH_GPU_BACKEND=${GPU_BACKEND} -DPEANO_WITH_GPU_ARCH=${GPU_ARCH} -DCMAKE_INSTALL_PREFIX=../install"
    - in_image "ccache --zero-stats && cd build && ninja && ccache --show-stats"
    - if [ "$RUN_UNIT_TESTS" = "true" ]; then in_image "cd build && ctest --output-on-failure --timeout 1800"; fi
    - in_image "cd build && ninja install"
  artifacts:
    when: always
    reports:
      junit: build/src/unittests/*/junit.xml
    paths:
      - ./install/
    exclude:
      - ./install/bin/*
      - ./install/bin/**/*
      - ./install/api/**/*
      - ./install/**/__pycache__/**/*
      - ./install/**/*.pyc
      - ./install/**/*.pyo
      - ./install/LICENSE
      - ./install/README.md
      - ./install/CONTRIBUTING.md
      - ./install/CODE_OF_CONDUCT.md
      - ./install/CITATION.cff
    expire_in: 24 hours
  extends: .RunOnAnyBranch
