API:
  stage: Test
  parallel:
    matrix:
      - test: [all_pde_terms, operator_tables]
  script:
    - in_image "mkdir -p api-tests/$test && cd api-tests/$test && PYTHONPATH=$CI_PROJECT_DIR/api python3 $CI_PROJECT_DIR/api/exahype2/tests/$test.py --build-mode $BUILD_MODE"
  rules:
    - if: '$GPU_BACKEND != "none"'
      when: never
    - !reference [".RunOnAnyBranch", "rules"]
  needs: [Build and Unit Tests]

FV:
  stage: Test
  parallel:
    matrix:
      - scenario: [breaking-dam, channel-flow, gaussian-bell, gaussian-explosion, point-explosion, smooth-convergence, taylor-green-vortex]
        dimensions: [2, 3]
      - scenario: [dry-ring, isothermal-stratification]
        dimensions: [2]
  script:
    - generate tests/fv "$scenario.py --dimensions $dimensions --build-mode $BUILD_MODE"
    - launch tests/fv "./ExaHyPE -nt ${NUMBER_OF_TIME_STEPS} -ns ${NUMBER_OF_SNAPSHOTS} -lmin ${MIN_GRID_LEVELS} -lmax ${MAX_GRID_LEVELS}"
    - 'if [ "$scenario" = gaussian-bell ]; then check_error_norms tests/fv GaussianBell.output/Error.csv 8e-3; fi'
  extends: .RunOnAnyBranch
  needs: [Build and Unit Tests]

FV Tracers:
  stage: Test
  parallel:
    matrix:
      - test: [fv-tracers-advection, fv-tracers-periodic-advection, fv-tracers-circular-bubble, fv-tracers-drag-force-validation, fv-tracers-vertical-plume-rise, fv-tracers-one-body-problem, fv-tracers-radial-jet, fv-tracers-volcanic-plume-rise]
        dimensions: [2]
  script:
    - generate tests/fv-tracers "$test.py --dimensions $dimensions --build-mode $BUILD_MODE"
    - launch tests/fv-tracers "./ExaHyPE -nt ${NUMBER_OF_TIME_STEPS} -ns ${NUMBER_OF_SNAPSHOTS} -lmin ${MIN_GRID_LEVELS} -lmax ${MAX_GRID_LEVELS}"
  extends: .RunOnlyOnMainBranch
  needs: [Build and Unit Tests]

FV Static AMR:
  stage: Test
  parallel:
    matrix:
      - periodic: ["on", "off"]
        dimensions: [2, 3]
  script:
    - generate tests/fv-static-amr "fv-static-amr.py --periodic-bc $periodic --dimensions $dimensions --build-mode $BUILD_MODE"
    - launch tests/fv-static-amr "./ExaHyPE -nt ${NUMBER_OF_TIME_STEPS} -ns ${NUMBER_OF_SNAPSHOTS} -lmin ${MIN_GRID_LEVELS} -lmax ${MAX_GRID_LEVELS}"
  extends: .RunOnlyOnMainBranch
  needs: [Build and Unit Tests]

Dynamic AMR:
  stage: Test
  parallel:
    matrix:
      - solver: [fv]
        test: [acoustic-point-explosion, euler-point-explosion, freestream, periodic-advection, radial-advection]
        dimensions: [2, 3]
      - solver: [aderdg, rkdg]
        test: [acoustic-point-explosion, freestream, periodic-advection, radial-advection]
        dimensions: [2, 3]
  script:
    - generate tests/$solver-dynamic-amr "$test.py --dimensions $dimensions --build-mode $BUILD_MODE"
    - launch tests/$solver-dynamic-amr "./ExaHyPE -nt ${NUMBER_OF_TIME_STEPS} -ns ${NUMBER_OF_SNAPSHOTS} -lmin ${MIN_GRID_LEVELS} -lmax ${MAX_GRID_LEVELS}"
    - 'if [ "$test" = freestream ]; then check_error_norms tests/$solver-dynamic-amr FreeStream.output/Error.csv 1e-10; fi'
  extends: .RunOnlyOnMainBranch
  needs: [Build and Unit Tests]

ADERDG:
  stage: Test
  parallel:
    matrix:
      - scenario: [AdvectionLinear, AcousticPlanarWaves, ElasticPlanarWaves, ElasticRickerPulse, EulerGaussianBell, EulerGaussianBell3D, EulerIsentropicVortex, SWERadialDamBreak, SWERestingLake, SWESteadyVortex, NavierStokesCosineBubble, NavierStokesTwoBubbles, NavierStokesTaylorGreen, NavierStokesABCFlow]
        precision: [float, double]
  script:
    - generate tests/aderdg "aderdg.py -s $scenario --build-mode $BUILD_MODE -pr $precision"
    - launch tests/aderdg "./ExaHyPE -nt ${NUMBER_OF_TIME_STEPS} -ns ${NUMBER_OF_SNAPSHOTS} -lmin ${MIN_GRID_LEVELS} -lmax ${MAX_GRID_LEVELS}"
    - 'if [ "$scenario" = EulerGaussianBell ] && [ "$precision" = double ]; then check_error_norms tests/aderdg EulerGaussianBell.output/Error_EulerGaussianBell.csv 5e-4; fi'
  extends: .RunOnAnyBranch
  needs: [Build and Unit Tests]

ADERDG Static AMR:
  stage: Test
  parallel:
    matrix:
      - test: [shallow-water-radial-dam-break, acoustic-point-explosion]
  script:
    - generate tests/aderdg-static-amr "$test.py --build-mode $BUILD_MODE"
    - launch tests/aderdg-static-amr "./ExaHyPE -nt ${NUMBER_OF_TIME_STEPS} -ns ${NUMBER_OF_SNAPSHOTS} -lmin ${MIN_GRID_LEVELS} -lmax ${MAX_GRID_LEVELS}"
  extends: .RunOnlyOnMainBranch
  needs: [Build and Unit Tests]

