  needs: [Build and Unit Tests]

ADERDG Coupling:
  stage: Test
  script:
    - generate tests/aderdg-coupling "LOH1.py --build-mode $BUILD_MODE"
    - launch tests/aderdg-coupling "./coupled_LOH1 -nt ${NUMBER_OF_TIME_STEPS} -ns ${NUMBER_OF_SNAPSHOTS} -lmin ${MIN_GRID_LEVELS} -lmax ${MAX_GRID_LEVELS}"
  extends: .RunOnlyOnMainBranch
  needs: [Build and Unit Tests]

RKDG:
  stage: Test
  parallel:
    matrix:
      - scenario: [AdvectionLinear, AcousticPlanarWaves, ElasticPlanarWaves, ElasticRickerPulse, EulerGaussianBell, EulerGaussianBell3D, EulerIsentropicVortex, SWERadialDamBreak, SWERestingLake, SWESteadyVortex, NavierStokesCosineBubble, NavierStokesTwoBubbles, NavierStokesTaylorGreen, NavierStokesABCFlow]
  script:
    - generate tests/rkdg "rkdg.py -s $scenario --build-mode $BUILD_MODE"
    - launch tests/rkdg "./ExaHyPE -nt ${NUMBER_OF_TIME_STEPS} -ns ${NUMBER_OF_SNAPSHOTS} -lmin ${MIN_GRID_LEVELS} -lmax ${MAX_GRID_LEVELS}"
    - 'if [ "$scenario" = EulerGaussianBell ]; then check_error_norms tests/rkdg EulerGaussianBell.output/Error_EulerGaussianBell.csv 1.5e-3; fi'
  extends: .RunOnAnyBranch
  needs: [Build and Unit Tests]

RKDG Static AMR:
  stage: Test
  parallel:
    matrix:
      - test: [shallow-water-radial-dam-break, acoustic-point-explosion]
  script:
    - generate tests/rkdg-static-amr "$test.py --build-mode $BUILD_MODE"
    - launch tests/rkdg-static-amr "./ExaHyPE -nt ${NUMBER_OF_TIME_STEPS} -ns ${NUMBER_OF_SNAPSHOTS} -lmin ${MIN_GRID_LEVELS} -lmax ${MAX_GRID_LEVELS}"
  extends: .RunOnlyOnMainBranch
  needs: [Build and Unit Tests]

Fortran Coupling:
  stage: Test
  script:
    - in_image "cd tests/fortran-coupling && FC=${FC} PYTHONPATH=$CI_PROJECT_DIR/api python3 fortran-coupling.py --build-mode $BUILD_MODE"
    - launch tests/fortran-coupling "./ExaHyPE -nt ${NUMBER_OF_TIME_STEPS} -ns ${NUMBER_OF_SNAPSHOTS} -lmin ${MIN_GRID_LEVELS} -lmax ${MAX_GRID_LEVELS}"
  rules:
    - if: '$GPU_BACKEND != "none"'
      when: never
    - !reference [".RunOnlyOnMainBranch", "rules"]
  needs: [Build and Unit Tests]

Tutorials:
  stage: Test
  parallel:
    matrix:
      - tutorial: [01_acoustic]
        notebook: [AcousticWaves.ipynb]
      - tutorial: [02_shallow-water]
        notebook: [ShallowWater.ipynb]
      - tutorial: [03_euler]
        notebook: [Euler.ipynb]
      - tutorial: [04_limiting]
        notebook: [EulerShock.ipynb]
      - tutorial: [05_elastic]
        notebook: [ElasticWaves.ipynb]
  script:
    # Without RUN_SIMULATIONS, the job runs the cells of the notebook up to its build.
    - if [ "$RUN_SIMULATIONS" = "true" ]; then tutorial_script=$notebook; else tutorial_script=build.ipy; in_image "python3 .gitlab/extract_build_cells.py tutorials/$tutorial/$notebook tutorials/$tutorial/$tutorial_script"; fi
    - in_image "cd tutorials/$tutorial && PYTHONPATH=$CI_PROJECT_DIR/api ipython $tutorial_script -- --build-mode $BUILD_MODE"
  rules:
    - if: '$GPU_BACKEND != "none"'
      when: never
    - !reference [".RunOnlyOnMainBranch", "rules"]
  needs: [Build and Unit Tests]
