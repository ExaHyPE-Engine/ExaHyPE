name: Static Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  Images:
    name: Images
    runs-on: ubuntu-24.04
    outputs:
      gcc: ${{ steps.images.outputs.gcc }}
    steps:
      - uses: actions/checkout@v7
      - id: images
        run: >-
          bash .github/scripts/wait-for-images.sh
          ${{ github.event.pull_request.head.repo.fork && '--no-wait' || '' }} gcc

  Style:
    name: Style
    needs: Images
    runs-on: ubuntu-24.04
    env:
      IMAGE: ${{ needs.Images.outputs.gcc }}
    steps:
      - uses: actions/checkout@v7
      - name: actionlint and shellcheck
        run: |
          installer=https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash
          bash <(curl -sSfL "${installer}") 1.7.12
          ./actionlint -color && rm actionlint
          shellcheck .github/scripts/*.sh
      - id: prepare
        if: ${{ !cancelled() }}
        run: bash .github/scripts/prepare-runner.sh
      - name: clang-format
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bash .github/scripts/in-image.sh "${IMAGE}" "python3 -m postprocessing.apply_clang_format --check"
      - name: black
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bash .github/scripts/in-image.sh "${IMAGE}" "python3 -m postprocessing.apply_black --check"
      - name: Includes
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bash .github/scripts/in-image.sh "${IMAGE}" "python3 -m postprocessing.check_includes"
      - name: Imports
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bash .github/scripts/in-image.sh "${IMAGE}" "python3 -m postprocessing.check_imports"
      - name: Python lint
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bash .github/scripts/in-image.sh "${IMAGE}" "python3 -m postprocessing.check_python_lint"
      - name: Dead code
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bash .github/scripts/in-image.sh "${IMAGE}" "python3 -m postprocessing.check_dead_code"

  Python-API:
    name: Python API
    needs: Images
    runs-on: ubuntu-24.04
    env:
      IMAGE: ${{ needs.Images.outputs.gcc }}
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/prepare-runner.sh
      - run: >-
          bash .github/scripts/in-image.sh "${IMAGE}"
          "python3 -m compileall -q -f ./
          && python3 tests/test_import_layers.py
          && PYTHONPATH=api python3 tests/test_operator_tables.py"

  Postprocessing:
    name: Postprocessing
    needs: Images
    runs-on: ubuntu-24.04
    env:
      IMAGE: ${{ needs.Images.outputs.gcc }}
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/prepare-runner.sh
      - run: >-
          bash .github/scripts/in-image.sh "${IMAGE}"
          "python3 -m unittest discover -s postprocessing/tests -t ."

  Static-Checks:
    name: Static Checks
    needs: [Images, Style, Python-API, Postprocessing]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: ${RESULTS}"
          [[ " ${RESULTS} " != *" failure "* && " ${RESULTS} " != *" cancelled "* && " ${RESULTS} " != *" skipped "* ]]
