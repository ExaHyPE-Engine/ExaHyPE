name: Engine Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: engine-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.plan.outputs.run }}
      scope: ${{ steps.plan.outputs.scope }}
      images: ${{ steps.plan.outputs.images }}
      branch: ${{ steps.plan.outputs.branch }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: bash .github/scripts/plan-engine-tests.sh | tee -a "${GITHUB_OUTPUT}"

  images:
    name: Images
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.images == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image-build.yml
    with:
      branch: ${{ needs.plan.outputs.branch }}
    secrets: inherit

  python:
    name: Python
    needs: [plan, images]
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    env:
      IMAGE_TAG: ${{ needs.plan.outputs.tag }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/in-image.sh base "python3 -m compileall -q -f ./ && python3 api/exahype2/tests/import_layers.py"

  postprocessing:
    name: Postprocessing
    needs: [plan, images]
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    env:
      IMAGE_TAG: ${{ needs.plan.outputs.tag }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/prepare-runner.sh
      - run: bash .github/scripts/in-image.sh gcc "python3 -m unittest discover -s postprocessing/tests -t ."

  style:
    name: Style
    needs: [plan, images]
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    env:
      IMAGE_TAG: ${{ needs.plan.outputs.tag }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color && rm actionlint
          shellcheck .github/scripts/*.sh
      - run: bash .github/scripts/prepare-runner.sh
      - run: bash .github/scripts/in-image.sh gcc "bash .github/scripts/check-style.sh"

  lfs:
    name: LFS
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: key
        run: echo "key=lfs-$(git lfs ls-files --long | sha256sum | cut -c1-16)" >>"${GITHUB_OUTPUT}"
      - id: cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: git lfs fetch

  cpu:
    name: "${{ matrix.toolchain.name }}: [${{ matrix.build-mode }}, ${{ matrix.toolchain.curve || 'Peano' }}]"
    needs: [plan, images, lfs]
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' && needs.lfs.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        build-mode: [Release, Debug, Asserts]
        toolchain:
          - { id: gcc, name: GCC, image: gcc, cc: gcc, cxx: g++, fc: gfortran, curve: Hilbert, sanitizer: address+undefined }
          - { id: intel, name: Intel, image: intel, cc: icx, cxx: icpx, fc: ifx }
          - { id: llvm, name: LLVM, image: llvm, cc: clang, cxx: clang++, fc: gfortran, sanitizer: address+undefined }
          - { id: nvidia, name: NVIDIA, image: nvidia, cc: nvc, cxx: nvc++, fc: nvfortran }
          - { id: amd, name: AMD, image: amd, cc: amdclang, cxx: amdclang++, fc: flang }
    uses: ./.github/workflows/engine-tests-toolchain.yml
    with:
      id: ${{ matrix.toolchain.id }}
      image: ${{ matrix.toolchain.image }}
      image-tag: ${{ needs.plan.outputs.tag }}
      scope: ${{ needs.plan.outputs.scope }}
      lfs-key: ${{ needs.lfs.outputs.key }}
      cc: ${{ matrix.toolchain.cc }}
      cxx: ${{ matrix.toolchain.cxx }}
      fc: ${{ matrix.toolchain.fc }}
      build-mode: ${{ matrix.build-mode }}
      curve: ${{ matrix.toolchain.curve || 'Peano' }}
      sanitizer: ${{ matrix.toolchain.sanitizer || 'none' }}
      gpu-backend: none
      gpu-arch: none
      cpu-device: false

  gpu:
    name: "${{ matrix.toolchain.name }}: [${{ matrix.build-mode }}, Peano]"
    needs: [plan, images, lfs]
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' && needs.lfs.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        build-mode: [Release, Debug, Asserts]
        toolchain:
          - { id: gcc-cuda, name: GCC CUDA, image: gcc, cc: gcc, cxx: g++, fc: gfortran, gpu-backend: native, gpu-arch: sm_75 }
          - { id: gcc-kokkos, name: GCC Kokkos, image: gcc, cc: gcc, cxx: nvcc_wrapper, fc: gfortran, gpu-backend: kokkos, gpu-arch: sm_75 }
          - { id: intel-sycl, name: Intel SYCL, image: intel, cc: icx, cxx: icpx, fc: ifx, gpu-backend: native, gpu-arch: spir64, cpu-device: true }
          - { id: intel-ompt, name: Intel OpenMP Target, image: intel, cc: icx, cxx: icpx, fc: ifx, gpu-backend: ompt, gpu-arch: spir64, cpu-device: true }
          - { id: intel-kokkos, name: Intel Kokkos, image: intel, cc: icx, cxx: icpx, fc: ifx, gpu-backend: kokkos, gpu-arch: spir64 }
          - { id: intel-acpp, name: Intel AdaptiveCpp, image: intel, cc: /opt/views/acpp/bin/clang, cxx: /opt/views/acpp/bin/clang++, fc: ifx, gpu-backend: acpp, gpu-arch: spir64 }
          - { id: llvm-cuda, name: LLVM CUDA, image: llvm, cc: clang, cxx: clang++, fc: gfortran, gpu-backend: native, gpu-arch: sm_75 }
          - { id: llvm-ompt, name: LLVM OpenMP Target, image: llvm, cc: clang, cxx: clang++, fc: gfortran, gpu-backend: ompt, gpu-arch: sm_75 }
          - { id: llvm-kokkos, name: LLVM Kokkos, image: llvm, cc: clang, cxx: clang++, fc: gfortran, gpu-backend: kokkos, gpu-arch: sm_75 }
          - { id: llvm-acpp, name: LLVM AdaptiveCpp, image: llvm, cc: clang, cxx: clang++, fc: gfortran, gpu-backend: acpp, gpu-arch: sm_75 }
          - { id: amd-hip, name: AMD HIP, image: amd, cc: amdclang, cxx: amdclang++, fc: flang, gpu-backend: native, gpu-arch: gfx90a }
          - { id: amd-ompt, name: AMD OpenMP Target, image: amd, cc: amdclang, cxx: amdclang++, fc: flang, gpu-backend: ompt, gpu-arch: gfx90a }
          - { id: amd-kokkos, name: AMD Kokkos, image: amd, cc: amdclang, cxx: hipcc, fc: flang, gpu-backend: kokkos, gpu-arch: gfx90a }
          - { id: amd-acpp, name: AMD AdaptiveCpp, image: amd, cc: amdclang, cxx: amdclang++, fc: flang, gpu-backend: acpp, gpu-arch: gfx90a }
    uses: ./.github/workflows/engine-tests-toolchain.yml
    with:
      id: ${{ matrix.toolchain.id }}
      image: ${{ matrix.toolchain.image }}
      image-tag: ${{ needs.plan.outputs.tag }}
      scope: ${{ needs.plan.outputs.scope }}
      lfs-key: ${{ needs.lfs.outputs.key }}
      cc: ${{ matrix.toolchain.cc }}
      cxx: ${{ matrix.toolchain.cxx }}
      fc: ${{ matrix.toolchain.fc }}
      build-mode: ${{ matrix.build-mode }}
      curve: Peano
      sanitizer: none
      gpu-backend: ${{ matrix.toolchain.gpu-backend || 'none' }}
      gpu-arch: ${{ matrix.toolchain.gpu-arch || 'none' }}
      cpu-device: ${{ matrix.toolchain.cpu-device || false }}

  result:
    name: Result
    needs: [plan, images, python, postprocessing, style, lfs, cpu, gpu]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: ${RESULTS}"
          [[ " ${RESULTS} " != *" failure "* && " ${RESULTS} " != *" cancelled "* ]]
