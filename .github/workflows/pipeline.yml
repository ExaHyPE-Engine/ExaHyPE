name: Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  Plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.plan.outputs.run }}
      gpu: ${{ steps.plan.outputs.gpu }}
      images: ${{ steps.plan.outputs.images }}
      branch: ${{ steps.plan.outputs.branch }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          run=true
          gpu=true
          images=true
          branch="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = push ] && [ "${branch}" != main ]; then
            gpu=false
            # The pull request of a branch of this repository runs every job for the same commit.
            ownRequests="map(select(.headRepositoryOwner.login == \"${GITHUB_REPOSITORY_OWNER}\")) | length"
            openRequests=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${branch}" --state open \
              --json headRepositoryOwner --jq "${ownRequests}")
            if [ "${openRequests}" -gt 0 ]; then
              run=false
            fi
          elif [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            branch="${HEAD_BRANCH}"
            if [ "${HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY}" ]; then
              images=false
              branch=main
            fi
          fi
          tag=latest
          if [ "${branch}" != main ]; then
            tag="branch-${branch//[^A-Za-z0-9_.-]/-}"
          fi
          {
            echo "run=${run}"
            echo "gpu=${gpu}"
            echo "images=${images}"
            echo "branch=${branch}"
            echo "tag=${tag}"
          } | tee -a "${GITHUB_OUTPUT}"

  LFS:
    name: LFS
    needs: Plan
    if: needs.Plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: key
        run: echo "key=lfs-$(git lfs ls-files --long | sha256sum | cut -c1-16)" >>"${GITHUB_OUTPUT}"
      - id: cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: git lfs fetch

  Images:
    name: Images
    needs: Plan
    if: needs.Plan.outputs.run == 'true' && needs.Plan.outputs.images == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      branch: ${{ needs.Plan.outputs.branch }}
    secrets: inherit

  Static:
    name: Static
    needs: [Plan, Images]
    if: ${{ !cancelled() && needs.Plan.outputs.run == 'true' }}
    uses: ./.github/workflows/static.yml
    with:
      image-tag: ${{ needs.Plan.outputs.tag }}

  CPU:
    name: CPU
    needs: [Plan, Images, LFS]
    if: ${{ !cancelled() && needs.Plan.outputs.run == 'true' && needs.LFS.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - AMD
          - GCC
          - Intel
          - LLVM
          - NVIDIA
        build-mode: [Release, Debug, Asserts]
        include:
          - toolchain: AMD
            id: amd
            image: amd
            cc: amdclang
            cxx: amdclang++
            fc: flang
          - toolchain: GCC
            id: gcc
            image: gcc
            cc: gcc
            cxx: g++
            fc: gfortran
            curve: Hilbert
            sanitizer: address+undefined
          - toolchain: Intel
            id: intel
            image: intel
            cc: icx
            cxx: icpx
            fc: ifx
          - toolchain: LLVM
            id: llvm
            image: llvm
            cc: clang
            cxx: clang++
            fc: gfortran
            sanitizer: address+undefined
          - toolchain: NVIDIA
            id: nvidia
            image: nvidia
            cc: nvc
            cxx: nvc++
            fc: nvfortran
    uses: ./.github/workflows/build-and-test.yml
    with:
      id: ${{ matrix.id }}
      image: ${{ matrix.image }}
      image-tag: ${{ needs.Plan.outputs.tag }}
      lfs-key: ${{ needs.LFS.outputs.key }}
      build-mode: ${{ matrix.build-mode }}
      cc: ${{ matrix.cc }}
      cxx: ${{ matrix.cxx }}
      fc: ${{ matrix.fc }}
      curve: ${{ matrix.curve || 'Peano' }}
      sanitizer: ${{ matrix.sanitizer || 'none' }}
      gpu-backend: none
      gpu-arch: none
      cpu-device: false

  GPU:
    name: GPU
    needs: [Plan, Images, LFS]
    if: >-
      ${{ !cancelled() && needs.Plan.outputs.run == 'true' && needs.Plan.outputs.gpu == 'true'
      && needs.LFS.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - AMD AdaptiveCpp
          - AMD HIP
          - AMD Kokkos
          - AMD OpenMP Target
          - GCC CUDA
          - GCC Kokkos
          - Intel AdaptiveCpp
          - Intel Kokkos
          - Intel OpenMP Target
          - Intel SYCL
          - LLVM AdaptiveCpp
          - LLVM CUDA
          - LLVM Kokkos
          - LLVM OpenMP Target
        build-mode: [Release, Debug, Asserts]
        include:
          - toolchain: AMD AdaptiveCpp
            id: amd-acpp
            image: amd
            cc: amdclang
            cxx: amdclang++
            fc: flang
            gpu-backend: acpp
            gpu-arch: gfx90a
          - toolchain: AMD HIP
            id: amd-hip
            image: amd
            cc: amdclang
            cxx: amdclang++
            fc: flang
            gpu-backend: native
            gpu-arch: gfx90a
          - toolchain: AMD Kokkos
            id: amd-kokkos
            image: amd
            cc: amdclang
            cxx: hipcc
            fc: flang
            gpu-backend: kokkos
            gpu-arch: gfx90a
          - toolchain: AMD OpenMP Target
            id: amd-ompt
            image: amd
            cc: amdclang
            cxx: amdclang++
            fc: flang
            gpu-backend: ompt
            gpu-arch: gfx90a
          - toolchain: GCC CUDA
            id: gcc-cuda
            image: gcc
            cc: gcc
            cxx: g++
            fc: gfortran
            gpu-backend: native
            gpu-arch: sm_75
          - toolchain: GCC Kokkos
            id: gcc-kokkos
            image: gcc
            cc: gcc
            cxx: nvcc_wrapper
            fc: gfortran
            gpu-backend: kokkos
            gpu-arch: sm_75
          - toolchain: Intel AdaptiveCpp
            id: intel-acpp
            image: intel
            cc: /opt/views/acpp/bin/clang
            cxx: /opt/views/acpp/bin/clang++
            fc: ifx
            gpu-backend: acpp
            gpu-arch: spir64
          - toolchain: Intel Kokkos
            id: intel-kokkos
            image: intel
            cc: icx
            cxx: icpx
            fc: ifx
            gpu-backend: kokkos
            gpu-arch: spir64
          - toolchain: Intel OpenMP Target
            id: intel-ompt
            image: intel
            cc: icx
            cxx: icpx
            fc: ifx
            gpu-backend: ompt
            gpu-arch: spir64
            cpu-device: true
          - toolchain: Intel SYCL
            id: intel-sycl
            image: intel
            cc: icx
            cxx: icpx
            fc: ifx
            gpu-backend: native
            gpu-arch: spir64
            cpu-device: true
          - toolchain: LLVM AdaptiveCpp
            id: llvm-acpp
            image: llvm
            cc: clang
            cxx: clang++
            fc: gfortran
            gpu-backend: acpp
            gpu-arch: sm_75
          - toolchain: LLVM CUDA
            id: llvm-cuda
            image: llvm
            cc: clang
            cxx: clang++
            fc: gfortran
            gpu-backend: native
            gpu-arch: sm_75
          - toolchain: LLVM Kokkos
            id: llvm-kokkos
            image: llvm
            cc: clang
            cxx: clang++
            fc: gfortran
            gpu-backend: kokkos
            gpu-arch: sm_75
          - toolchain: LLVM OpenMP Target
            id: llvm-ompt
            image: llvm
            cc: clang
            cxx: clang++
            fc: gfortran
            gpu-backend: ompt
            gpu-arch: sm_75
    uses: ./.github/workflows/build-and-test.yml
    with:
      id: ${{ matrix.id }}
      image: ${{ matrix.image }}
      image-tag: ${{ needs.Plan.outputs.tag }}
      lfs-key: ${{ needs.LFS.outputs.key }}
      build-mode: ${{ matrix.build-mode }}
      cc: ${{ matrix.cc }}
      cxx: ${{ matrix.cxx }}
      fc: ${{ matrix.fc }}
      curve: Peano
      sanitizer: none
      gpu-backend: ${{ matrix.gpu-backend }}
      gpu-arch: ${{ matrix.gpu-arch }}
      cpu-device: ${{ matrix.cpu-device || false }}

  Result:
    name: Result
    needs: [Plan, LFS, Images, Static, CPU, GPU]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: ${RESULTS}"
          [[ " ${RESULTS} " != *" failure "* && " ${RESULTS} " != *" cancelled "* ]]
