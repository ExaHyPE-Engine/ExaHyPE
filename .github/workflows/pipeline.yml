  result:
    name: Result
    needs:
      - plan
      - lfs
      - images
      - postprocessing
      - python
      - style
      - amd
      - gcc
      - intel
      - llvm
      - nvidia
      - amd-acpp
      - amd-hip
      - amd-kokkos
      - amd-ompt
      - gcc-cuda
      - gcc-kokkos
      - intel-acpp
      - intel-kokkos
      - intel-ompt
      - intel-sycl
      - llvm-acpp
      - llvm-cuda
      - llvm-kokkos
      - llvm-ompt
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: ${RESULTS}"
          [[ " ${RESULTS} " != *" failure "* && " ${RESULTS} " != *" cancelled "* ]]
