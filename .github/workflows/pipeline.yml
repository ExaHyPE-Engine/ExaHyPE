name: Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.plan.outputs.run }}
      scope: ${{ steps.plan.outputs.scope }}
      images: ${{ steps.plan.outputs.images }}
      branch: ${{ steps.plan.outputs.branch }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          run=true
          scope=full
          images=true
          branch="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = push ] && [ "${branch}" != main ]; then
            scope=branch
            # The pull request of a branch of this repository runs the full tests of the same commit.
            ownRequests="map(select(.headRepositoryOwner.login == \"${GITHUB_REPOSITORY_OWNER}\")) | length"
            openRequests=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${branch}" --state open \
              --json headRepositoryOwner --jq "${ownRequests}")
            if [ "${openRequests}" -gt 0 ]; then
              run=false
            fi
          elif [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            branch="${HEAD_BRANCH}"
            if [ "${HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY}" ]; then
              images=false
              branch=main
            fi
          fi
          tag=latest
          if [ "${branch}" != main ]; then
            tag="branch-${branch//[^A-Za-z0-9_.-]/-}"
          fi
          {
            echo "run=${run}"
            echo "scope=${scope}"
            echo "images=${images}"
            echo "branch=${branch}"
            echo "tag=${tag}"
          } | tee -a "${GITHUB_OUTPUT}"

  lfs:
    name: LFS
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: key
        run: echo "key=lfs-$(git lfs ls-files --long | sha256sum | cut -c1-16)" >>"${GITHUB_OUTPUT}"
      - id: cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: git lfs fetch

  images:
    name: Images
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.images == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      branch: ${{ needs.plan.outputs.branch }}
    secrets: inherit

  static:
    name: Static
    needs: [plan, images]
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' }}
    uses: ./.github/workflows/static.yml
    with:
      image-tag: ${{ needs.plan.outputs.tag }}

  cpu:
    name: CPU
    needs: [plan, images, lfs]
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' && needs.lfs.result != 'failure' }}
    uses: ./.github/workflows/cpu.yml
    with:
      image-tag: ${{ needs.plan.outputs.tag }}
      scope: ${{ needs.plan.outputs.scope }}
      lfs-key: ${{ needs.lfs.outputs.key }}

  gpu:
    name: GPU
    needs: [plan, images, lfs]
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' && needs.lfs.result != 'failure' }}
    uses: ./.github/workflows/gpu.yml
    with:
      image-tag: ${{ needs.plan.outputs.tag }}
      scope: ${{ needs.plan.outputs.scope }}
      lfs-key: ${{ needs.lfs.outputs.key }}

  result:
    name: Result
    needs: [plan, lfs, images, static, cpu, gpu]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: ${RESULTS}"
          [[ " ${RESULTS} " != *" failure "* && " ${RESULTS} " != *" cancelled "* ]]
