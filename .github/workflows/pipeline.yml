name: Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  pull-requests: read

env:
  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.plan.outputs.run }}
      scope: ${{ steps.plan.outputs.scope }}
      images: ${{ steps.plan.outputs.images }}
      branch: ${{ steps.plan.outputs.branch }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          run=true
          scope=full
          images=true
          branch="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = push ] && [ "${branch}" != main ]; then
            scope=branch
            # The pull request of a branch of this repository runs the full tests of the same commit.
            openRequests=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${branch}" --state open \
              --json headRepositoryOwner --jq "map(select(.headRepositoryOwner.login == \"${GITHUB_REPOSITORY_OWNER}\")) | length")
            if [ "${openRequests}" -gt 0 ]; then
              run=false
            fi
          elif [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            branch="${HEAD_BRANCH}"
            if [ "${HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY}" ]; then
              images=false
              branch=main
            fi
          fi
          tag=latest
          if [ "${branch}" != main ]; then
            tag="branch-${branch//[^A-Za-z0-9_.-]/-}"
          fi
          {
            echo "run=${run}"
            echo "scope=${scope}"
            echo "images=${images}"
            echo "branch=${branch}"
            echo "tag=${tag}"
          } | tee -a "${GITHUB_OUTPUT}"

  lfs:
    name: LFS
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: key
        run: echo "key=lfs-$(git lfs ls-files --long | sha256sum | cut -c1-16)" >>"${GITHUB_OUTPUT}"
      - id: cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: ${{ steps.key.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: git lfs fetch

  images:
    name: Images
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.images == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      branch: ${{ needs.plan.outputs.branch }}
    secrets: inherit

  postprocessing:
    name: Postprocessing
    needs: [plan, images]
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    env:
      IMAGE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/prepare-runner.sh
      - run: bash .github/scripts/in-image.sh gcc "python3 -m unittest discover -s postprocessing/tests -t ."

  python:
    name: Python API
    needs: [plan, images]
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    env:
      IMAGE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/prepare-runner.sh
      - run: |
          bash .github/scripts/in-image.sh gcc "python3 -m compileall -q -f ./ \
            && python3 api/exahype2/tests/check_import_layers.py \
            && PYTHONPATH=api python3 api/exahype2/tests/check_operator_tables.py"

  style:
    name: Style
    needs: [plan, images]
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    env:
      IMAGE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color && rm actionlint
          shellcheck .github/scripts/*.sh
      - id: prepare
        run: bash .github/scripts/prepare-runner.sh
      - name: clang-format
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bash .github/scripts/in-image.sh gcc "python3 -m postprocessing.apply_clang_format --check"
      - name: black
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bash .github/scripts/in-image.sh gcc "python3 -m postprocessing.apply_black --check"
      - name: Includes
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bash .github/scripts/in-image.sh gcc "python3 -m postprocessing.check_includes"
      - name: Imports
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bash .github/scripts/in-image.sh gcc "python3 -m postprocessing.check_imports"
      - name: Python lint
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bash .github/scripts/in-image.sh gcc "python3 -m postprocessing.check_python_lint"
      - name: Dead code
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bash .github/scripts/in-image.sh gcc "python3 -m postprocessing.check_dead_code"

  amd:
    name: AMD
    needs: [plan, images, lfs]
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' && needs.lfs.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        build-mode: [Release, Debug, Asserts]
    uses: ./.github/workflows/build-and-test.yml
    with:
      id: amd
      image: amd
      image-tag: ${{ needs.plan.outputs.tag }}
      scope: ${{ needs.plan.outputs.scope }}
      lfs-key: ${{ needs.lfs.outputs.key }}
      build-mode: ${{ matrix.build-mode }}
      cc: amdclang
      cxx: amdclang++
      fc: flang
      curve: Peano
      sanitizer: none
      gpu-backend: none
      gpu-arch: none
      cpu-device: false

