name: Image Build

on:
  workflow_call:
    inputs:
      branch:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      images:
        description: Images to build, separated by spaces (empty builds every outdated image)
        default: ""
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIXES: ${{ vars.IMAGE_PREFIXES }}
  IMAGE_BRANCH: ${{ inputs.branch || github.ref_name }}
  GHCR_USERNAME: ${{ github.actor }}
  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.plan.outputs.base }}
      spack: ${{ steps.plan.outputs.spack }}
      toolchains: ${{ steps.plan.outputs.toolchains }}
      tutorials: ${{ steps.plan.outputs.tutorials }}
      applications: ${{ steps.plan.outputs.applications }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          IMAGES: ${{ inputs.images }}
        run: |
          read -r -a prefixes <<<"${IMAGE_PREFIXES:-ghcr.io/${GITHUB_REPOSITORY_OWNER,,}}"
          export IMAGE_PREFIX="${prefixes[0]}"
          docker login ghcr.io --username "${GHCR_USERNAME}" --password-stdin <<<"${GHCR_TOKEN}"
          read -r -a requestedImages <<<"${IMAGES}"
          bash .github/scripts/plan-images.sh "${IMAGE_BRANCH}" "${requestedImages[@]}" | tee -a "${GITHUB_OUTPUT}"

  base:
    name: Base
    needs: plan
    if: needs.plan.outputs.base == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/build-image.sh base

  spack:
    name: Spack
    needs: [plan, base]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.spack == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/build-image.sh spack

  toolchain:
    name: ${{ matrix.toolchain.name }}
    needs: [plan, spack]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.toolchains != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: ${{ fromJSON(needs.plan.outputs.toolchains) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/prepare-runner.sh
      - run: bash .github/scripts/build-image.sh ${{ matrix.toolchain.image }}

  tutorials:
    name: Tutorials
    needs: [plan, toolchain]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.tutorials == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/build-image.sh tutorials

  applications:
    name: Applications
    needs: [plan, toolchain]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.applications == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: lfs
        run: echo "key=lfs-$(git lfs ls-files --long | sha256sum | cut -c1-16)" >>"${GITHUB_OUTPUT}"
      - id: cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: ${{ steps.lfs.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: git lfs fetch
      - run: git lfs checkout
      - run: bash .github/scripts/prepare-runner.sh
      - run: bash .github/scripts/build-image.sh applications
