name: Images

on:
  workflow_call:
    inputs:
      branch:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      images:
        description: Images to build, separated by spaces (empty builds every outdated image)
        default: ""
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGES: ${{ inputs.images }}
  IMAGE_PREFIXES: ${{ vars.IMAGE_PREFIXES }}
  IMAGE_BRANCH: ${{ inputs.branch || github.ref_name }}
  GHCR_USERNAME: ${{ github.actor }}
  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  base:
    name: Base
    runs-on: ubuntu-24.04
    outputs:
      hash: ${{ steps.build.outputs.hash }}
    steps:
      - uses: actions/checkout@v7
      - id: build
        env:
          SOURCES: >-
            utilities/docker/Dockerfile.base
        run: bash .github/scripts/build-image.sh base

  spack:
    name: Spack
    needs: base
    runs-on: ubuntu-24.04
    outputs:
      hash: ${{ steps.build.outputs.hash }}
    steps:
      - uses: actions/checkout@v7
      - id: build
        env:
          SOURCES: >-
            utilities/docker/Dockerfile.spack
        run: bash .github/scripts/build-image.sh spack "${{ needs.base.outputs.hash }}"

  amd:
    name: AMD
    needs: spack
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      hash: ${{ steps.build.outputs.hash }}
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/prepare-runner.sh
      - id: build
        env:
          SOURCES: >-
            utilities/docker/Dockerfile.amd utilities/spack/compilers/amd/ requirements.txt utilities/spack/repo.yaml
            utilities/spack/packages/
        run: bash .github/scripts/build-image.sh amd "${{ needs.spack.outputs.hash }}"

  gcc:
    name: GCC
    needs: spack
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      hash: ${{ steps.build.outputs.hash }}
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/prepare-runner.sh
      - id: build
        env:
          SOURCES: >-
            utilities/docker/Dockerfile.gcc utilities/spack/compilers/gcc/ requirements.txt
        run: bash .github/scripts/build-image.sh gcc "${{ needs.spack.outputs.hash }}"

  intel:
    name: Intel
    needs: spack
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      hash: ${{ steps.build.outputs.hash }}
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/prepare-runner.sh
      - id: build
        env:
          SOURCES: >-
            utilities/docker/Dockerfile.intel utilities/spack/compilers/intel/ requirements.txt
            utilities/spack/repo.yaml utilities/spack/packages/
        run: bash .github/scripts/build-image.sh intel "${{ needs.spack.outputs.hash }}"

  llvm:
    name: LLVM
    needs: spack
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      hash: ${{ steps.build.outputs.hash }}
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/prepare-runner.sh
      - id: build
        env:
          SOURCES: >-
            utilities/docker/Dockerfile.llvm utilities/spack/compilers/llvm/ requirements.txt
            utilities/spack/repo.yaml utilities/spack/packages/
        run: bash .github/scripts/build-image.sh llvm "${{ needs.spack.outputs.hash }}"

  nvidia:
    name: NVIDIA
    needs: spack
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      hash: ${{ steps.build.outputs.hash }}
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/prepare-runner.sh
      - id: build
        env:
          SOURCES: >-
            utilities/docker/Dockerfile.nvidia utilities/spack/compilers/nvidia/ requirements.txt
        run: bash .github/scripts/build-image.sh nvidia "${{ needs.spack.outputs.hash }}"

  exahype:
    name: ExaHyPE
    needs: spack
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      hash: ${{ steps.build.outputs.hash }}
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/prepare-runner.sh
      - id: build
        env:
          SOURCES: >-
            utilities/docker/Dockerfile.exahype utilities/spack/repo.yaml utilities/spack/packages/exahype2/
            CMakeLists.txt cmake/ src/ api/ requirements.txt
        run: bash .github/scripts/build-image.sh exahype "${{ needs.spack.outputs.hash }}"

  tutorials:
    name: Tutorials
    needs: exahype
    runs-on: ubuntu-24.04
    outputs:
      hash: ${{ steps.build.outputs.hash }}
    steps:
      - uses: actions/checkout@v7
      - id: build
        env:
          SOURCES: >-
            utilities/docker/Dockerfile.tutorials tutorials/
        run: bash .github/scripts/build-image.sh tutorials "${{ needs.exahype.outputs.hash }}"

  applications:
    name: Applications
    needs: exahype
    runs-on: ubuntu-24.04
    outputs:
      hash: ${{ steps.build.outputs.hash }}
    steps:
      - uses: actions/checkout@v7
      - id: lfs
        run: echo "key=lfs-$(git lfs ls-files --long | sha256sum | cut -c1-16)" >>"${GITHUB_OUTPUT}"
      - id: cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: ${{ steps.lfs.outputs.key }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: git lfs fetch
      - run: git lfs checkout
      - run: bash .github/scripts/prepare-runner.sh
      - id: build
        env:
          SOURCES: >-
            utilities/docker/Dockerfile.applications applications/
        run: bash .github/scripts/build-image.sh applications "${{ needs.exahype.outputs.hash }}"
