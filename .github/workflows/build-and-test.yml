name: Build and Test

on:
  workflow_call:
    inputs:
      id: { type: string, required: true }
      image: { type: string, required: true }
      image-tag: { type: string, required: true }
      lfs-key: { type: string, required: false, default: "" }
      cc: { type: string, required: true }
      cxx: { type: string, required: true }
      fc: { type: string, required: true }
      build-mode: { type: string, required: true }
      curve: { type: string, required: true }
      sanitizer: { type: string, required: true }
      gpu-backend: { type: string, required: true }
      gpu-arch: { type: string, required: true }
      cpu-device: { type: boolean, required: true }

env:
  IMAGE_TAG: ${{ inputs.image-tag }}
  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  IMAGE: ${{ inputs.image }}
  CI_COMMIT_REF_NAME: ${{ github.head_ref || github.ref_name }}
  CC: ${{ inputs.cc }}
  CXX: ${{ inputs.cxx }}
  FC: ${{ inputs.fc }}
  BUILD_MODE: ${{ inputs.build-mode }}
  SPACE_FILLING_CURVE: ${{ inputs.curve }}
  SANITIZER: ${{ inputs.build-mode == 'Asserts' && inputs.sanitizer || 'none' }}
  GPU_BACKEND: ${{ inputs.gpu-backend }}
  GPU_ARCH: ${{ inputs.gpu-arch }}
  RUN_UNIT_TESTS: ${{ inputs.gpu-backend == 'none' || (inputs.cpu-device && inputs.build-mode == 'Release') }}
  RUN_SIMULATIONS: ${{ inputs.gpu-backend == 'none' || (inputs.cpu-device && inputs.build-mode == 'Release') }}
  # GitHub runs the jobs of one toolchain on runners with different CPUs.
  EXTRA_CONFIGURATION_OPTIONS: >-
    -DPEANO_WITH_CPU_ARCH=x86-64-v3 ${{ inputs.gpu-backend != 'none' && '-DPEANO_WITH_FPE=OFF' || '' }}
  MIN_GRID_LEVELS: ${{ inputs.curve == 'Hilbert' && '3' || '2' }}
  MAX_GRID_LEVELS: ${{ inputs.curve == 'Hilbert' && '5' || '4' }}
  ASAN_OPTIONS: ${{ inputs.sanitizer != 'none' && 'detect_leaks=0' || '' }}
  UBSAN_OPTIONS: ${{ inputs.sanitizer != 'none' && 'print_stacktrace=1:halt_on_error=1' || '' }}
  OMPI_MCA_pml: ${{ inputs.sanitizer != 'none' && 'ob1' || '' }}
  OMPI_MCA_osc: ${{ inputs.sanitizer != 'none' && '^ucx' || '' }}
  OMPI_MCA_btl: ${{ inputs.sanitizer != 'none' && 'self,sm,tcp' || '' }}
  # The binary memory patcher of Open MPI rewrites the allocator entry points that the address sanitizer
  # interposes. MPI_Init_thread then raises a segmentation fault.
  OMPI_MCA_memory: ${{ inputs.sanitizer != 'none' && '^patcher' || '' }}
  UCX_TLS: ${{ inputs.sanitizer != 'none' && 'tcp,sm' || '' }}
  SYCL_CACHE_PERSISTENT: ${{ inputs.id == 'intel-sycl' && '1' || '' }}
  # The OpenMP runtime of oneAPI offloads to the CPU through its OpenCL plugin.
  LIBOMPTARGET_PLUGIN: ${{ inputs.id == 'intel-ompt' && 'OPENCL' || '' }}
  LIBOMPTARGET_DEVICETYPE: ${{ inputs.id == 'intel-ompt' && 'CPU' || '' }}

jobs:
  Build-and-Unit-Tests:
    name: Build and Unit Tests
    outputs:
      families: ${{ steps.families.outputs.families }}
    runs-on: ubuntu-24.04
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ccache
      CMAKE_HIP_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: 100M
    steps:
      - id: families
        run: |
          families=("Code Generation" FV "FV Tracers" "FV Static AMR" "Dynamic AMR" ADERDG "ADERDG Static AMR"
            "ADERDG Limiting" "ADERDG GRMHD" "ADERDG Coupling" RKDG "RKDG Static AMR" "Fortran Coupling" Tutorials
            "ExaSkred Tsunami" "ExaSkred Meteotsunami" "ExaSkred Landslide" "ExaSkred Coupled" ExaSeis ExaGRyPE)
          selected=()
          for family in "${families[@]}"; do
            # Skip the families whose PDE terms run on the host only.
            if [ "${GPU_BACKEND}" = none ] ||
              [[ "${family}" != @("Code Generation"|"Fortran Coupling"|Tutorials) ]]; then
              selected+=("${family}")
            fi
          done
          echo "families=$(printf '%s\n' "${selected[@]}" | jq -R . | jq -cs .)" >>"${GITHUB_OUTPUT}"
      - uses: actions/checkout@v7
      - run: bash .github/scripts/prepare-runner.sh
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ inputs.id }}-${{ inputs.build-mode }}-${{ github.sha }}
          restore-keys: ccache-${{ inputs.id }}-${{ inputs.build-mode }}-
      - run: |
          bash .github/scripts/in-image.sh "${{ inputs.image }}" '
            echo "Running CI with $(nproc) cores"
            echo "CC=${CC} CXX=${CXX} FC=${FC}"
            mkdir -p build && cd build
            cmake .. -GNinja -DBUILD_TESTING=ON -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON -DPEANO_WITH_FPE=ON \
              -DPEANO_WITH_HDF5=ON -DPEANO_WITH_NETCDF=ON ${EXTRA_CONFIGURATION_OPTIONS} \
              -DSUPPORTED_BUILD_TYPES="${BUILD_MODE}" -DPEANO_WITH_SANITIZER="${SANITIZER}" \
              -DPEANO_WITH_SPACE_FILLING_CURVE="${SPACE_FILLING_CURVE}" -DPEANO_WITH_GPU_BACKEND="${GPU_BACKEND}" \
              -DPEANO_WITH_GPU_ARCH="${GPU_ARCH}" -DCMAKE_INSTALL_PREFIX=../install
            ccache --zero-stats
            ninja -j "$(nproc)"
            ccache --show-stats
            if [ "${RUN_UNIT_TESTS}" = true ]; then
              ctest --output-on-failure --timeout 1800
            fi
            ninja install'
      - uses: actions/upload-artifact@v7
        with:
          name: install-${{ inputs.id }}-${{ inputs.build-mode }}
          path: install/
          retention-days: 1

  Family:
    name: ${{ matrix.family }}
    needs: Build-and-Unit-Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(needs.Build-and-Unit-Tests.outputs.families) }}
    steps:
      - uses: actions/checkout@v7
      - if: startsWith(matrix.family, 'Exa')
        uses: actions/cache/restore@v6
        with:
          path: .git/lfs
          key: ${{ inputs.lfs-key }}
          fail-on-cache-miss: true
      - if: startsWith(matrix.family, 'Exa')
        run: git lfs checkout
      - run: bash .github/scripts/prepare-runner.sh
      - uses: actions/download-artifact@v8
        with:
          name: install-${{ inputs.id }}-${{ inputs.build-mode }}
          path: install/
      - name: ${{ matrix.family }}
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          failures=()
          # Runs a command inside the image and records a failure under the title of the scenario.
          step() {
            echo "::group::$1"
            if ! bash .github/scripts/in-image.sh "${IMAGE}" "$2"; then
              echo "::error::$1 failed"
              failures+=("$1")
            fi
            echo "::endgroup::"
          }
          # Generates the executable of a scenario, runs it with the executable of its family and compares its error
          # norms with a tolerance.
          # Arguments: <folder> <generator and arguments> [<error file> <tolerance>]
          scenario() {
            local command="cd $1 && PYTHONPATH=${PWD}/api python3 $2 --build-mode ${BUILD_MODE}"
            if [ "${RUN_SIMULATIONS}" = true ]; then
              command+=" && OMP_NUM_THREADS=2 mpirun --bind-to none -np 2 ${executable}"
              if [ -n "${3:-}" ]; then
                command+=" && PYTHONPATH=${PWD} python3 -m postprocessing.check_error_norms $3 $4"
              fi
            fi
            step "$1: $2" "${command}"
          }
          # Runs a tutorial notebook. Without simulations, it runs the cells of the notebook up to its build.
          tutorial() {
            local folder="${1%/*}" script="${1##*/}"
            if [ "${RUN_SIMULATIONS}" != true ]; then
              python3 .github/scripts/extract-build-cells.py "$1" "${folder}/build.ipy"
              script=build.ipy
            fi
            step "${folder}" "cd ${folder} && PYTHONPATH=${PWD}/api ipython ${script} -- --build-mode ${BUILD_MODE}"
          }
          STEPS="-nt 300 -ns 2 -lmin ${MIN_GRID_LEVELS} -lmax ${MAX_GRID_LEVELS}"
          executable="./ExaHyPE ${STEPS}"
          case "${FAMILY}" in
          "Code Generation")
            mkdir -p code-generation
            step "Code Generation" "cd code-generation && PYTHONPATH=${PWD}/api python3 \
              ${PWD}/api/exahype2/tests/generate_all_pde_terms.py --build-mode ${BUILD_MODE}"
            ;;
          "FV")
            scenario tests/fv "breaking-dam.py --dimensions 2"
            scenario tests/fv "breaking-dam.py --dimensions 3"
            scenario tests/fv "channel-flow.py --dimensions 2"
            scenario tests/fv "channel-flow.py --dimensions 3"
            scenario tests/fv "gaussian-bell.py --dimensions 2" GaussianBell.output/Error.csv 8e-3
            scenario tests/fv "gaussian-bell.py --dimensions 3" GaussianBell.output/Error.csv 8e-3
            scenario tests/fv "gaussian-explosion.py --dimensions 2"
            scenario tests/fv "gaussian-explosion.py --dimensions 3"
            scenario tests/fv "point-explosion.py --dimensions 2"
            scenario tests/fv "point-explosion.py --dimensions 3"
            scenario tests/fv "smooth-convergence.py --dimensions 2"
            scenario tests/fv "smooth-convergence.py --dimensions 3"
            scenario tests/fv "taylor-green-vortex.py --dimensions 2"
            scenario tests/fv "taylor-green-vortex.py --dimensions 3"
            scenario tests/fv "dry-ring.py --dimensions 2"
            scenario tests/fv "isothermal-stratification.py --dimensions 2"
            ;;
          "FV Tracers")
            scenario tests/fv-tracers "fv-tracers-advection.py --dimensions 2"
            scenario tests/fv-tracers "fv-tracers-periodic-advection.py --dimensions 2"
            scenario tests/fv-tracers "fv-tracers-circular-bubble.py --dimensions 2"
            scenario tests/fv-tracers "fv-tracers-drag-force-validation.py --dimensions 2"
            scenario tests/fv-tracers "fv-tracers-vertical-plume-rise.py --dimensions 2"
            scenario tests/fv-tracers "fv-tracers-one-body-problem.py --dimensions 2"
            scenario tests/fv-tracers "fv-tracers-radial-jet.py --dimensions 2"
            scenario tests/fv-tracers "fv-tracers-volcanic-plume-rise.py --dimensions 2"
            ;;
          "FV Static AMR")
            scenario tests/fv-static-amr "fv-static-amr.py --periodic-bc on --dimensions 2"
            scenario tests/fv-static-amr "fv-static-amr.py --periodic-bc on --dimensions 3"
            scenario tests/fv-static-amr "fv-static-amr.py --periodic-bc off --dimensions 2"
            scenario tests/fv-static-amr "fv-static-amr.py --periodic-bc off --dimensions 3"
            ;;
          "Dynamic AMR")
            scenario tests/fv-dynamic-amr "acoustic-point-explosion.py --dimensions 2"
            scenario tests/fv-dynamic-amr "acoustic-point-explosion.py --dimensions 3"
            scenario tests/fv-dynamic-amr "freestream.py --dimensions 2" FreeStream.output/Error.csv 1e-10
            scenario tests/fv-dynamic-amr "freestream.py --dimensions 3" FreeStream.output/Error.csv 1e-10
            scenario tests/fv-dynamic-amr "periodic-advection.py --dimensions 2"
            scenario tests/fv-dynamic-amr "periodic-advection.py --dimensions 3"
            scenario tests/fv-dynamic-amr "radial-advection.py --dimensions 2"
            scenario tests/fv-dynamic-amr "radial-advection.py --dimensions 3"
            scenario tests/fv-dynamic-amr "euler-point-explosion.py --dimensions 2"
            scenario tests/fv-dynamic-amr "euler-point-explosion.py --dimensions 3"
            scenario tests/aderdg-dynamic-amr "acoustic-point-explosion.py --dimensions 2"
            scenario tests/aderdg-dynamic-amr "acoustic-point-explosion.py --dimensions 3"
            scenario tests/aderdg-dynamic-amr "freestream.py --dimensions 2" FreeStream.output/Error.csv 1e-10
            scenario tests/aderdg-dynamic-amr "freestream.py --dimensions 3" FreeStream.output/Error.csv 1e-10
            scenario tests/aderdg-dynamic-amr "periodic-advection.py --dimensions 2"
            scenario tests/aderdg-dynamic-amr "periodic-advection.py --dimensions 3"
            scenario tests/aderdg-dynamic-amr "radial-advection.py --dimensions 2"
            scenario tests/aderdg-dynamic-amr "radial-advection.py --dimensions 3"
            scenario tests/rkdg-dynamic-amr "acoustic-point-explosion.py --dimensions 2"
            scenario tests/rkdg-dynamic-amr "acoustic-point-explosion.py --dimensions 3"
            scenario tests/rkdg-dynamic-amr "freestream.py --dimensions 2" FreeStream.output/Error.csv 1e-10
            scenario tests/rkdg-dynamic-amr "freestream.py --dimensions 3" FreeStream.output/Error.csv 1e-10
            scenario tests/rkdg-dynamic-amr "periodic-advection.py --dimensions 2"
            scenario tests/rkdg-dynamic-amr "periodic-advection.py --dimensions 3"
            scenario tests/rkdg-dynamic-amr "radial-advection.py --dimensions 2"
            scenario tests/rkdg-dynamic-amr "radial-advection.py --dimensions 3"
            ;;
          "ADERDG")
            scenario tests/aderdg "aderdg.py -s AdvectionLinear -pr float"
            scenario tests/aderdg "aderdg.py -s AdvectionLinear -pr double"
            scenario tests/aderdg "aderdg.py -s AcousticPlanarWaves -pr float"
            scenario tests/aderdg "aderdg.py -s AcousticPlanarWaves -pr double"
            scenario tests/aderdg "aderdg.py -s ElasticPlanarWaves -pr float"
            scenario tests/aderdg "aderdg.py -s ElasticPlanarWaves -pr double"
            scenario tests/aderdg "aderdg.py -s ElasticRickerPulse -pr float"
            scenario tests/aderdg "aderdg.py -s ElasticRickerPulse -pr double"
            scenario tests/aderdg "aderdg.py -s EulerGaussianBell -pr float"
            scenario tests/aderdg "aderdg.py -s EulerGaussianBell -pr double" \
              EulerGaussianBell.output/Error_EulerGaussianBell.csv 5e-4
            scenario tests/aderdg "aderdg.py -s EulerGaussianBell3D -pr float"
            scenario tests/aderdg "aderdg.py -s EulerGaussianBell3D -pr double"
            scenario tests/aderdg "aderdg.py -s EulerIsentropicVortex -pr float"
            scenario tests/aderdg "aderdg.py -s EulerIsentropicVortex -pr double"
            scenario tests/aderdg "aderdg.py -s SWERadialDamBreak -pr float"
            scenario tests/aderdg "aderdg.py -s SWERadialDamBreak -pr double"
            scenario tests/aderdg "aderdg.py -s SWERestingLake -pr float"
            scenario tests/aderdg "aderdg.py -s SWERestingLake -pr double"
            scenario tests/aderdg "aderdg.py -s SWESteadyVortex -pr float"
            scenario tests/aderdg "aderdg.py -s SWESteadyVortex -pr double"
            scenario tests/aderdg "aderdg.py -s NavierStokesCosineBubble -pr float"
            scenario tests/aderdg "aderdg.py -s NavierStokesCosineBubble -pr double"
            scenario tests/aderdg "aderdg.py -s NavierStokesTwoBubbles -pr float"
            scenario tests/aderdg "aderdg.py -s NavierStokesTwoBubbles -pr double"
            scenario tests/aderdg "aderdg.py -s NavierStokesTaylorGreen -pr float"
            scenario tests/aderdg "aderdg.py -s NavierStokesTaylorGreen -pr double"
            scenario tests/aderdg "aderdg.py -s NavierStokesABCFlow -pr float"
            scenario tests/aderdg "aderdg.py -s NavierStokesABCFlow -pr double"
            ;;
          "ADERDG Static AMR")
            scenario tests/aderdg-static-amr shallow-water-radial-dam-break.py
            scenario tests/aderdg-static-amr acoustic-point-explosion.py
            ;;
          "ADERDG Limiting")
            scenario tests/aderdg-limiting euler-airfoil.py
            scenario tests/aderdg-limiting euler-corner-blast.py
            scenario tests/aderdg-limiting euler-double-rarefaction.py
            scenario tests/aderdg-limiting euler-quadrant-riemann.py
            scenario tests/aderdg-limiting euler-rayleigh-taylor.py
            ;;
          "ADERDG GRMHD")
            scenario tests/aderdg-grmhd "aderdg-grmhd.py -s AlfvenWave"
            scenario tests/aderdg-grmhd "aderdg-grmhd.py -s MichelSphericalAccretion"
            ;;
          "ADERDG Coupling")
            executable="./coupled_LOH1 ${STEPS}"
            scenario tests/aderdg-coupling LOH1.py
            ;;
          "RKDG")
            scenario tests/rkdg "rkdg.py -s AdvectionLinear"
            scenario tests/rkdg "rkdg.py -s AcousticPlanarWaves"
            scenario tests/rkdg "rkdg.py -s ElasticPlanarWaves"
            scenario tests/rkdg "rkdg.py -s ElasticRickerPulse"
            scenario tests/rkdg "rkdg.py -s EulerGaussianBell" \
              EulerGaussianBell.output/Error_EulerGaussianBell.csv 1.5e-3
            scenario tests/rkdg "rkdg.py -s EulerGaussianBell3D"
            scenario tests/rkdg "rkdg.py -s EulerIsentropicVortex"
            scenario tests/rkdg "rkdg.py -s SWERadialDamBreak"
            scenario tests/rkdg "rkdg.py -s SWERestingLake"
            scenario tests/rkdg "rkdg.py -s SWESteadyVortex"
            scenario tests/rkdg "rkdg.py -s NavierStokesCosineBubble"
            scenario tests/rkdg "rkdg.py -s NavierStokesTwoBubbles"
            scenario tests/rkdg "rkdg.py -s NavierStokesTaylorGreen"
            scenario tests/rkdg "rkdg.py -s NavierStokesABCFlow"
            ;;
          "RKDG Static AMR")
            scenario tests/rkdg-static-amr shallow-water-radial-dam-break.py
            scenario tests/rkdg-static-amr acoustic-point-explosion.py
            ;;
          "Fortran Coupling")
            scenario tests/fortran-coupling fortran-coupling.py
            ;;
          "Tutorials")
            tutorial tutorials/01_acoustic/AcousticWaves.ipynb
            tutorial tutorials/02_shallow-water/ShallowWater.ipynb
            tutorial tutorials/03_euler/Euler.ipynb
            tutorial tutorials/04_limiting/EulerShock.ipynb
            tutorial tutorials/05_elastic/ElasticWaves.ipynb
            ;;
          "ExaSkred Tsunami")
            executable="./ExaSkred-Tsunami ${STEPS}"
            scenario applications/exaskred/tsunami/artificial artificial.py
            scenario applications/exaskred/tsunami/chile chile.py
            scenario applications/exaskred/tsunami/oscillating-lake oscillating-lake.py
            scenario applications/exaskred/tsunami/solitary-wave solitary-wave.py
            scenario applications/exaskred/tsunami/three-mounds-channel three-mounds-channel.py
            scenario applications/exaskred/tsunami/tohoku tohoku.py
            ;;
          "ExaSkred Meteotsunami")
            executable="./ExaSkred-Meteotsunami ${STEPS}"
            scenario applications/exaskred/meteotsunami/gulf-of-mexico gulf-of-mexico.py
            scenario applications/exaskred/meteotsunami/r1 r1.py
            ;;
          "ExaSkred Landslide")
            executable="./ExaSkred-Landslide ${STEPS}"
            scenario applications/exaskred/landslide/tafjord tafjord.py
            ;;
          "ExaSkred Coupled")
            executable="./ExaSkred-Coupled ${STEPS}"
            scenario applications/exaskred/coupled/impulse-wave impulse-wave.py
            scenario applications/exaskred/coupled/tafjord tafjord.py
            ;;
          "ExaSeis")
            executable="./ExaSeis ${STEPS}"
            scenario applications/exaseis/cartesian cartesian.py
            scenario applications/exaseis/curvilinear "curvilinear.py -s LOH1"
            scenario applications/exaseis/curvilinear "curvilinear.py -s Zugspitze"
            scenario applications/exaseis/pml "pml.py -s LOH1"
            scenario applications/exaseis/pml "pml.py -s Zugspitze"
            scenario applications/exaseis/dynamic-rupture "dynamic-rupture.py -s TPV5"
            scenario applications/exaseis/dynamic-rupture "dynamic-rupture.py -s TPV6"
            scenario applications/exaseis/dynamic-rupture "dynamic-rupture.py -s TPV16"
            scenario applications/exaseis/dynamic-rupture "dynamic-rupture.py -s TPV26"
            scenario applications/exaseis/dynamic-rupture "dynamic-rupture.py -s TPV28"
            scenario applications/exaseis/dynamic-rupture "dynamic-rupture.py -s TPV29"
            scenario applications/exaseis/dynamic-rupture "dynamic-rupture.py -s TPV34"
            scenario applications/exaseis/dynamic-rupture "dynamic-rupture.py -s Husavik"
            scenario applications/exaseis/pml-dynamic-rupture "pml-dynamic-rupture.py -s TPV5"
            scenario applications/exaseis/pml-dynamic-rupture "pml-dynamic-rupture.py -s TPV6"
            scenario applications/exaseis/pml-dynamic-rupture "pml-dynamic-rupture.py -s TPV16"
            scenario applications/exaseis/pml-dynamic-rupture "pml-dynamic-rupture.py -s TPV26"
            scenario applications/exaseis/pml-dynamic-rupture "pml-dynamic-rupture.py -s TPV28"
            scenario applications/exaseis/pml-dynamic-rupture "pml-dynamic-rupture.py -s TPV29"
            scenario applications/exaseis/pml-dynamic-rupture "pml-dynamic-rupture.py -s TPV34"
            scenario applications/exaseis/pml-dynamic-rupture "pml-dynamic-rupture.py -s Husavik"
            ;;
          "ExaGRyPE")
            executable="./ExaGRyPE -nt 500 -ns 2 -l 1"
            scenario applications/exagrype/gauge-wave "gauge-wave.py --solver fv"
            ;;
          esac
          if [ "${#failures[@]}" -gt 0 ]; then
            printf 'Failed: %s\n' "${failures[@]}"
            exit 1
          fi
