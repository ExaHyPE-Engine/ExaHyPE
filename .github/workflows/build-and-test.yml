name: Build and Test

on:
  workflow_call:
    inputs:
      id: { type: string, required: true }
      image: { type: string, required: true }
      image-tag: { type: string, required: true }
      scope: { type: string, required: true }
      lfs-key: { type: string, required: false, default: "" }
      cc: { type: string, required: true }
      cxx: { type: string, required: true }
      fc: { type: string, required: true }
      build-mode: { type: string, required: true }
      curve: { type: string, required: true }
      sanitizer: { type: string, required: true }
      gpu-backend: { type: string, required: true }
      gpu-arch: { type: string, required: true }
      cpu-device: { type: boolean, required: true }

env:
  IMAGE_TAG: ${{ inputs.image-tag }}
  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  IMAGE: ${{ inputs.image }}
  CI_COMMIT_REF_NAME: ${{ github.head_ref || github.ref_name }}
  CC: ${{ inputs.cc }}
  CXX: ${{ inputs.cxx }}
  FC: ${{ inputs.fc }}
  BUILD_MODE: ${{ inputs.build-mode }}
  SPACE_FILLING_CURVE: ${{ inputs.curve }}
  SANITIZER: ${{ inputs.build-mode == 'Asserts' && inputs.sanitizer || 'none' }}
  GPU_BACKEND: ${{ inputs.gpu-backend }}
  GPU_ARCH: ${{ inputs.gpu-arch }}
  RUN_UNIT_TESTS: ${{ inputs.gpu-backend == 'none' || (inputs.cpu-device && inputs.build-mode == 'Release') }}
  RUN_SIMULATIONS: ${{ inputs.gpu-backend == 'none' || (inputs.cpu-device && inputs.build-mode == 'Release') }}
  # GitHub runs the jobs of one toolchain on runners with different CPUs.
  EXTRA_CONFIGURATION_OPTIONS: -DPEANO_WITH_CPU_ARCH=x86-64-v3 ${{ inputs.gpu-backend != 'none' && '-DPEANO_WITH_FPE=OFF' || '' }}
  MIN_GRID_LEVELS: ${{ inputs.curve == 'Hilbert' && '3' || '2' }}
  MAX_GRID_LEVELS: ${{ inputs.curve == 'Hilbert' && '5' || '4' }}
  STEPS: -nt 300 -ns 2 -lmin ${{ inputs.curve == 'Hilbert' && '3' || '2' }} -lmax ${{ inputs.curve == 'Hilbert' && '5' || '4' }}
  ASAN_OPTIONS: ${{ inputs.sanitizer != 'none' && 'detect_leaks=0' || '' }}
  UBSAN_OPTIONS: ${{ inputs.sanitizer != 'none' && 'print_stacktrace=1:halt_on_error=1' || '' }}
  OMPI_MCA_pml: ${{ inputs.sanitizer != 'none' && 'ob1' || '' }}
  OMPI_MCA_osc: ${{ inputs.sanitizer != 'none' && '^ucx' || '' }}
  OMPI_MCA_btl: ${{ inputs.sanitizer != 'none' && 'self,sm,tcp' || '' }}
  # The binary memory patcher of Open MPI rewrites the allocator entry points that the address sanitizer
  # interposes. MPI_Init_thread then raises a segmentation fault.
  OMPI_MCA_memory: ${{ inputs.sanitizer != 'none' && '^patcher' || '' }}
  UCX_TLS: ${{ inputs.sanitizer != 'none' && 'tcp,sm' || '' }}
  SYCL_CACHE_PERSISTENT: ${{ inputs.id == 'intel-sycl' && '1' || '' }}
  # The OpenMP runtime of oneAPI offloads to the CPU through its OpenCL plugin.
  LIBOMPTARGET_PLUGIN: ${{ inputs.id == 'intel-ompt' && 'OPENCL' || '' }}
  LIBOMPTARGET_DEVICETYPE: ${{ inputs.id == 'intel-ompt' && 'CPU' || '' }}

jobs:
  build:
    name: Build and Unit Tests
    runs-on: ubuntu-24.04
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ccache
      CMAKE_HIP_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: 100M
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/prepare-runner.sh
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ inputs.id }}-${{ inputs.build-mode }}-${{ github.sha }}
          restore-keys: ccache-${{ inputs.id }}-${{ inputs.build-mode }}-
      - run: |
          bash .github/scripts/in-image.sh "${{ inputs.image }}" '
            echo "Running CI with $(nproc) cores"
            echo "CC=${CC} CXX=${CXX} FC=${FC}"
            mkdir -p build && cd build
            cmake .. -GNinja -DBUILD_TESTING=ON -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON -DPEANO_WITH_FPE=ON \
              -DPEANO_WITH_HDF5=ON -DPEANO_WITH_NETCDF=ON ${EXTRA_CONFIGURATION_OPTIONS} \
              -DSUPPORTED_BUILD_TYPES="${BUILD_MODE}" -DPEANO_WITH_SANITIZER="${SANITIZER}" \
              -DPEANO_WITH_SPACE_FILLING_CURVE="${SPACE_FILLING_CURVE}" -DPEANO_WITH_GPU_BACKEND="${GPU_BACKEND}" \
              -DPEANO_WITH_GPU_ARCH="${GPU_ARCH}" -DCMAKE_INSTALL_PREFIX=../install
            ccache --zero-stats
            ninja -j "$(nproc)"
            ccache --show-stats
            if [ "${RUN_UNIT_TESTS}" = true ]; then
              ctest --output-on-failure --timeout 1800
            fi
            ninja install'
      - uses: actions/upload-artifact@v7
        with:
          name: install-${{ inputs.id }}-${{ inputs.build-mode }}
          path: install/
          retention-days: 1

  code-generation:
    name: Code Generation
    needs: build
    if: inputs.gpu-backend == 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/prepare-runner.sh
      - id: install
        uses: actions/download-artifact@v8
        with:
          name: install-${{ inputs.id }}-${{ inputs.build-mode }}
          path: install/
      - name: Code Generation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          bash .github/scripts/in-image.sh "${{ inputs.image }}" "mkdir -p code-generation && cd code-generation
          && PYTHONPATH=${PWD}/api python3 ${PWD}/api/exahype2/tests/generate_all_pde_terms.py --build-mode ${BUILD_MODE}"

  fv:
    name: FV
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/prepare-runner.sh
      - id: install
        uses: actions/download-artifact@v8
        with:
          name: install-${{ inputs.id }}-${{ inputs.build-mode }}
          path: install/
      - name: tests/fv breaking-dam.py --dimensions 2
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: ./.github/actions/scenario
        with: { folder: tests/fv, generator: breaking-dam.py --dimensions 2 }
      - name: tests/fv breaking-dam.py --dimensions 3
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: ./.github/actions/scenario
        with: { folder: tests/fv, generator: breaking-dam.py --dimensions 3 }
      - name: tests/fv channel-flow.py --dimensions 2
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: ./.github/actions/scenario
        with: { folder: tests/fv, generator: channel-flow.py --dimensions 2 }
      - name: tests/fv channel-flow.py --dimensions 3
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: ./.github/actions/scenario
        with: { folder: tests/fv, generator: channel-flow.py --dimensions 3 }
      - name: tests/fv gaussian-bell.py --dimensions 2
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: ./.github/actions/scenario
        with: { folder: tests/fv, generator: gaussian-bell.py --dimensions 2, errors: GaussianBell.output/Error.csv 8e-3 }
      - name: tests/fv gaussian-bell.py --dimensions 3
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: ./.github/actions/scenario
        with: { folder: tests/fv, generator: gaussian-bell.py --dimensions 3, errors: GaussianBell.output/Error.csv 8e-3 }
      - name: tests/fv gaussian-explosion.py --dimensions 2
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: ./.github/actions/scenario
        with: { folder: tests/fv, generator: gaussian-explosion.py --dimensions 2 }
      - name: tests/fv gaussian-explosion.py --dimensions 3
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: ./.github/actions/scenario
        with: { folder: tests/fv, generator: gaussian-explosion.py --dimensions 3 }
      - name: tests/fv point-explosion.py --dimensions 2
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: ./.github/actions/scenario
        with: { folder: tests/fv, generator: point-explosion.py --dimensions 2 }
      - name: tests/fv point-explosion.py --dimensions 3
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: ./.github/actions/scenario
        with: { folder: tests/fv, generator: point-explosion.py --dimensions 3 }
      - name: tests/fv smooth-convergence.py --dimensions 2
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: ./.github/actions/scenario
        with: { folder: tests/fv, generator: smooth-convergence.py --dimensions 2 }
      - name: tests/fv smooth-convergence.py --dimensions 3
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: ./.github/actions/scenario
        with: { folder: tests/fv, generator: smooth-convergence.py --dimensions 3 }
      - name: tests/fv taylor-green-vortex.py --dimensions 2
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: ./.github/actions/scenario
        with: { folder: tests/fv, generator: taylor-green-vortex.py --dimensions 2 }
      - name: tests/fv taylor-green-vortex.py --dimensions 3
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: ./.github/actions/scenario
        with: { folder: tests/fv, generator: taylor-green-vortex.py --dimensions 3 }
      - name: tests/fv dry-ring.py --dimensions 2
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: ./.github/actions/scenario
        with: { folder: tests/fv, generator: dry-ring.py --dimensions 2 }
      - name: tests/fv isothermal-stratification.py --dimensions 2
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: ./.github/actions/scenario
        with: { folder: tests/fv, generator: isothermal-stratification.py --dimensions 2 }

