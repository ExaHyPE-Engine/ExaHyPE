  aderdg:
    name: ADERDG
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/prepare-runner.sh
      - id: install
        uses: actions/download-artifact@v8
        with:
          name: install-${{ inputs.id }}-${{ inputs.build-mode }}
          path: install/
      - name: tests/aderdg aderdg.py -s AdvectionLinear -pr float
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: ./.github/actions/scenario
        with: { folder: tests/aderdg, generator: aderdg.py -s AdvectionLinear -pr float }
      - name: tests/aderdg aderdg.py -s AdvectionLinear -pr double
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: ./.github/actions/scenario
        with: { folder: tests/aderdg, generator: aderdg.py -s AdvectionLinear -pr double }
