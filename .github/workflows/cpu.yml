name: CPU

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cpu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CI_COMMIT_REF_NAME: ${{ github.head_ref || github.ref_name }}
  PARALLEL_LAUNCH: env OMP_NUM_THREADS=2 mpirun --bind-to none -np 2

jobs:
  Images:
    name: Images
    runs-on: ubuntu-24.04
    outputs:
      amd: ${{ steps.images.outputs.amd }}
      gcc: ${{ steps.images.outputs.gcc }}
      intel: ${{ steps.images.outputs.intel }}
      llvm: ${{ steps.images.outputs.llvm }}
      nvidia: ${{ steps.images.outputs.nvidia }}
    steps:
      - uses: actions/checkout@v7
      - id: images
        run: >-
          bash .github/scripts/wait-for-images.sh
          ${{ github.event.pull_request.head.repo.fork && '--no-wait' || '' }} amd gcc intel llvm nvidia

  LFS:
    name: LFS
    runs-on: ubuntu-24.04
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: key
        run: echo "key=lfs-$(git lfs ls-files --long | sha256sum | cut -c1-16)" >>"${GITHUB_OUTPUT}"
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: ${{ steps.key.outputs.key }}
      - run: git lfs fetch

  Build:
    name: Build ${{ matrix.toolchain.name }} ${{ matrix.mode }}
    needs: Images
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: &compilers
          - { name: AMD, image: amd, cc: amdclang, cxx: amdclang++, curve: Peano }
          - { name: GCC, image: gcc, cc: gcc, cxx: g++, curve: Hilbert }
          - { name: Intel, image: intel, cc: icx, cxx: icpx, curve: Peano }
          - { name: LLVM, image: llvm, cc: clang, cxx: clang++, curve: Peano }
          - { name: NVIDIA, image: nvidia, cc: nvc, cxx: nvc++, curve: Peano }
        mode: [Release, Debug, Asserts]
    env:
      IMAGE: ${{ needs.Images.outputs[matrix.toolchain.image] }}
      CC: ${{ matrix.toolchain.cc }}
      CXX: ${{ matrix.toolchain.cxx }}
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: 100M
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/prepare-runner.sh
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ github.workflow }}-${{ matrix.toolchain.name }}-${{ matrix.mode }}-${{ github.sha }}
          restore-keys: ccache-${{ github.workflow }}-${{ matrix.toolchain.name }}-${{ matrix.mode }}-
      - run: |
          bash .github/scripts/in-image.sh "${IMAGE}" '
            mkdir -p build && cd build
            cmake .. -GNinja -DBUILD_TESTING=ON -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
              -DCMAKE_INSTALL_PREFIX=../install \
              -DSUPPORTED_BUILD_TYPES=${{ matrix.mode }} -DPEANO_WITH_SPACE_FILLING_CURVE=${{ matrix.toolchain.curve }} \
              -DPEANO_WITH_CPU_ARCH=x86-64-v3 -DPEANO_WITH_FPE=ON
            ccache --zero-stats
            ninja -j "$(nproc)"
            ccache --show-stats
            ctest --output-on-failure --timeout 1800
            ninja install'
      - uses: actions/upload-artifact@v7
        with:
          name: install-${{ matrix.toolchain.name }}-${{ matrix.mode }}
          path: install/
          retention-days: 1

  Examples:
    name: Examples ${{ matrix.toolchain.name }} ${{ matrix.mode }}
    needs: [Images, Build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        toolchain: *compilers
        mode: [Release, Debug, Asserts]
    env:
      IMAGE: ${{ needs.Images.outputs[matrix.toolchain.image] }}
      CC: ${{ matrix.toolchain.cc }}
      CXX: ${{ matrix.toolchain.cxx }}
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/prepare-runner.sh
      - uses: actions/download-artifact@v8
        with:
          name: install-${{ matrix.toolchain.name }}-${{ matrix.mode }}
          path: install/
      - run: >-
          bash .github/scripts/in-image.sh "${IMAGE}"
          "python3 tests/test_examples.py --build-mode ${{ matrix.mode }} --curve ${{ matrix.toolchain.curve }}"

  Tutorials:
    name: Tutorials ${{ matrix.toolchain.name }} ${{ matrix.mode }}
    needs: [Images, Build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        toolchain: *compilers
        mode: [Release, Debug, Asserts]
    env:
      IMAGE: ${{ needs.Images.outputs[matrix.toolchain.image] }}
      CC: ${{ matrix.toolchain.cc }}
      CXX: ${{ matrix.toolchain.cxx }}
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/prepare-runner.sh
      - uses: actions/download-artifact@v8
        with:
          name: install-${{ matrix.toolchain.name }}-${{ matrix.mode }}
          path: install/
      - run: bash .github/scripts/in-image.sh "${IMAGE}" "python3 tests/test_tutorials.py --build-mode ${{ matrix.mode }}"

  Applications:
    name: Applications ${{ matrix.toolchain.name }} ${{ matrix.mode }}
    needs: [Images, LFS, Build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        toolchain: *compilers
        mode: [Release, Debug, Asserts]
    env:
      IMAGE: ${{ needs.Images.outputs[matrix.toolchain.image] }}
      CC: ${{ matrix.toolchain.cc }}
      CXX: ${{ matrix.toolchain.cxx }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          path: .git/lfs
          key: ${{ needs.LFS.outputs.key }}
          fail-on-cache-miss: true
      - run: git lfs checkout
      - run: bash .github/scripts/prepare-runner.sh
      - uses: actions/download-artifact@v8
        with:
          name: install-${{ matrix.toolchain.name }}-${{ matrix.mode }}
          path: install/
      - run: >-
          bash .github/scripts/in-image.sh "${IMAGE}"
          "python3 tests/test_applications.py --build-mode ${{ matrix.mode }} --curve ${{ matrix.toolchain.curve }}"

  CPU:
    name: CPU
    needs: [Images, LFS, Build, Examples, Tutorials, Applications]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: ${RESULTS}"
          [[ " ${RESULTS} " != *" failure "* && " ${RESULTS} " != *" cancelled "* && " ${RESULTS} " != *" skipped "* ]]
