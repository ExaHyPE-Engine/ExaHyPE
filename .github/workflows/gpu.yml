name: GPU

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gpu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CI_COMMIT_REF_NAME: ${{ github.head_ref || github.ref_name }}
  PARALLEL_LAUNCH: env OMP_NUM_THREADS=2 mpirun --bind-to none -np 2

jobs:
  Images:
    name: Images
    runs-on: ubuntu-24.04
    outputs:
      amd: ${{ steps.images.outputs.amd }}
      gcc: ${{ steps.images.outputs.gcc }}
      intel: ${{ steps.images.outputs.intel }}
      llvm: ${{ steps.images.outputs.llvm }}
    steps:
      - uses: actions/checkout@v7
      - id: images
        run: >-
          bash .github/scripts/wait-for-images.sh
          ${{ github.event.pull_request.head.repo.fork && '--no-wait' || '' }} amd gcc intel llvm

  LFS:
    name: LFS
    runs-on: ubuntu-24.04
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: key
        run: echo "key=lfs-$(git lfs ls-files --long | sha256sum | cut -c1-16)" >>"${GITHUB_OUTPUT}"
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: ${{ steps.key.outputs.key }}
      - run: git lfs fetch

  Build:
    name: Build ${{ matrix.toolchain.name }} ${{ matrix.mode }}
    needs: Images
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: &backends
          - { name: AMD AdaptiveCpp, image: amd, cc: amdclang, cxx: amdclang++, backend: acpp, arch: gfx90a }
          - { name: AMD HIP, image: amd, cc: amdclang, cxx: amdclang++, backend: native, arch: gfx90a }
          - { name: AMD Kokkos, image: amd, cc: amdclang, cxx: hipcc, backend: kokkos, arch: gfx90a }
          - { name: AMD OpenMP Target, image: amd, cc: amdclang, cxx: amdclang++, backend: ompt, arch: gfx90a }
          - { name: GCC CUDA, image: gcc, cc: gcc, cxx: g++, backend: native, arch: sm_75 }
          - { name: GCC Kokkos, image: gcc, cc: gcc, cxx: nvcc_wrapper, backend: kokkos, arch: sm_75 }
          - { name: Intel AdaptiveCpp, image: intel, cc: /opt/views/acpp/bin/clang, cxx: /opt/views/acpp/bin/clang++, backend: acpp, arch: spir64 }
          - { name: Intel Kokkos, image: intel, cc: icx, cxx: icpx, backend: kokkos, arch: spir64 }
          - { name: Intel OpenMP Target, image: intel, cc: icx, cxx: icpx, backend: ompt, arch: spir64, cpu-device: LIBOMPTARGET_PLUGIN=OPENCL LIBOMPTARGET_DEVICETYPE=CPU }
          - { name: Intel SYCL, image: intel, cc: icx, cxx: icpx, backend: native, arch: spir64, cpu-device: SYCL_CACHE_PERSISTENT=1 }
          - { name: LLVM AdaptiveCpp, image: llvm, cc: clang, cxx: clang++, backend: acpp, arch: sm_75 }
          - { name: LLVM CUDA, image: llvm, cc: clang, cxx: clang++, backend: native, arch: sm_75 }
          - { name: LLVM Kokkos, image: llvm, cc: clang, cxx: clang++, backend: kokkos, arch: sm_75 }
          - { name: LLVM OpenMP Target, image: llvm, cc: clang, cxx: clang++, backend: ompt, arch: sm_75 }
        mode: [Release, Debug, Asserts]
    env:
      IMAGE: ${{ needs.Images.outputs[matrix.toolchain.image] }}
      CC: ${{ matrix.toolchain.cc }}
      CXX: ${{ matrix.toolchain.cxx }}
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ccache
      CMAKE_HIP_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: 100M
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/prepare-runner.sh
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ github.workflow }}-${{ matrix.toolchain.name }}-${{ matrix.mode }}-${{ github.sha }}
          restore-keys: ccache-${{ github.workflow }}-${{ matrix.toolchain.name }}-${{ matrix.mode }}-
      - run: |
          bash .github/scripts/in-image.sh "${IMAGE}" '
            mkdir -p build && cd build
            cmake .. -GNinja -DBUILD_TESTING=ON -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
              -DCMAKE_INSTALL_PREFIX=../install \
              -DSUPPORTED_BUILD_TYPES=${{ matrix.mode }} -DPEANO_WITH_GPU_BACKEND=${{ matrix.toolchain.backend }} \
              -DPEANO_WITH_GPU_ARCH=${{ matrix.toolchain.arch }} -DPEANO_WITH_CPU_ARCH=x86-64-v3
            ccache --zero-stats
            ninja -j "$(nproc)"
            ccache --show-stats
            ninja install'
      - if: matrix.toolchain.cpu-device
        run: >-
          bash .github/scripts/in-image.sh "${IMAGE}"
          "cd build && env ${{ matrix.toolchain.cpu-device }} ctest --output-on-failure --timeout 1800"
      - uses: actions/upload-artifact@v7
        with:
          name: install-${{ matrix.toolchain.name }}-${{ matrix.mode }}
          path: install/
          retention-days: 1

  Examples:
    name: Examples ${{ matrix.toolchain.name }} ${{ matrix.mode }}
    needs: [Images, Build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        toolchain: *backends
        mode: [Release, Debug, Asserts]
    env:
      IMAGE: ${{ needs.Images.outputs[matrix.toolchain.image] }}
      CC: ${{ matrix.toolchain.cc }}
      CXX: ${{ matrix.toolchain.cxx }}
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/prepare-runner.sh
      - uses: actions/download-artifact@v8
        with:
          name: install-${{ matrix.toolchain.name }}-${{ matrix.mode }}
          path: install/
      - run: >-
          bash .github/scripts/in-image.sh "${IMAGE}"
          "env ${{ matrix.toolchain.cpu-device }} python3 tests/test_examples.py --build-mode ${{ matrix.mode }}
          ${{ !matrix.toolchain.cpu-device && '--build-only' || '' }}"

  Applications:
    name: Applications ${{ matrix.toolchain.name }} ${{ matrix.mode }}
    needs: [Images, LFS, Build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        toolchain: *backends
        mode: [Release, Debug, Asserts]
    env:
      IMAGE: ${{ needs.Images.outputs[matrix.toolchain.image] }}
      CC: ${{ matrix.toolchain.cc }}
      CXX: ${{ matrix.toolchain.cxx }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          path: .git/lfs
          key: ${{ needs.LFS.outputs.key }}
          fail-on-cache-miss: true
      - run: git lfs checkout
      - run: bash .github/scripts/prepare-runner.sh
      - uses: actions/download-artifact@v8
        with:
          name: install-${{ matrix.toolchain.name }}-${{ matrix.mode }}
          path: install/
      - run: >-
          bash .github/scripts/in-image.sh "${IMAGE}"
          "env ${{ matrix.toolchain.cpu-device }} python3 tests/test_applications.py --build-mode ${{ matrix.mode }}
          ${{ !matrix.toolchain.cpu-device && '--build-only' || '' }}"

  GPU:
    name: GPU
    needs: [Images, LFS, Build, Examples, Applications]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: ${RESULTS}"
          [[ " ${RESULTS} " != *" failure "* && " ${RESULTS} " != *" cancelled "* && " ${RESULTS} " != *" skipped "* ]]
