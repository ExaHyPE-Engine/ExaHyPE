      scope: ${{ inputs.scope }}
      lfs-key: ${{ inputs.lfs-key }}
      build-mode: ${{ matrix.build-mode }}
      cc: /opt/views/acpp/bin/clang
      cxx: /opt/views/acpp/bin/clang++
      fc: ifx
      curve: Peano
      sanitizer: none
      gpu-backend: acpp
      gpu-arch: spir64
      cpu-device: false

  intel-kokkos:
    name: Intel Kokkos
    strategy:
      fail-fast: false
      matrix:
        build-mode: [Release, Debug, Asserts]
    uses: ./.github/workflows/build-and-test.yml
    with:
      name: Intel Kokkos
      id: intel-kokkos
      image: intel
      image-tag: ${{ inputs.image-tag }}
      scope: ${{ inputs.scope }}
      lfs-key: ${{ inputs.lfs-key }}
      build-mode: ${{ matrix.build-mode }}
      cc: icx
      cxx: icpx
      fc: ifx
      curve: Peano
      sanitizer: none
      gpu-backend: kokkos
      gpu-arch: spir64
      cpu-device: false

  intel-ompt:
    name: Intel OpenMP Target
    strategy:
      fail-fast: false
      matrix:
        build-mode: [Release, Debug, Asserts]
    uses: ./.github/workflows/build-and-test.yml
    with:
      name: Intel OpenMP Target
      id: intel-ompt
      image: intel
      image-tag: ${{ inputs.image-tag }}
      scope: ${{ inputs.scope }}
      lfs-key: ${{ inputs.lfs-key }}
      build-mode: ${{ matrix.build-mode }}
      cc: icx
      cxx: icpx
      fc: ifx
      curve: Peano
      sanitizer: none
      gpu-backend: ompt
      gpu-arch: spir64
      cpu-device: true

  intel-sycl:
    name: Intel SYCL
    strategy:
      fail-fast: false
      matrix:
        build-mode: [Release, Debug, Asserts]
    uses: ./.github/workflows/build-and-test.yml
    with:
      name: Intel SYCL
      id: intel-sycl
      image: intel
      image-tag: ${{ inputs.image-tag }}
      scope: ${{ inputs.scope }}
      lfs-key: ${{ inputs.lfs-key }}
      build-mode: ${{ matrix.build-mode }}
      cc: icx
      cxx: icpx
      fc: ifx
      curve: Peano
      sanitizer: none
      gpu-backend: native
      gpu-arch: spir64
      cpu-device: true

  llvm-acpp:
    name: LLVM AdaptiveCpp
    strategy:
      fail-fast: false
      matrix:
        build-mode: [Release, Debug, Asserts]
    uses: ./.github/workflows/build-and-test.yml
    with:
      name: LLVM AdaptiveCpp
      id: llvm-acpp
      image: llvm
      image-tag: ${{ inputs.image-tag }}
      scope: ${{ inputs.scope }}
      lfs-key: ${{ inputs.lfs-key }}
      build-mode: ${{ matrix.build-mode }}
      cc: clang
      cxx: clang++
      fc: gfortran
      curve: Peano
      sanitizer: none
      gpu-backend: acpp
      gpu-arch: sm_75
      cpu-device: false

  llvm-cuda:
    name: LLVM CUDA
    strategy:
      fail-fast: false
