name: GPU

on:
  workflow_call:
    inputs:
      image-tag: { type: string, required: true }
      scope: { type: string, required: true }
      lfs-key: { type: string, required: false, default: "" }

jobs:
  amd-acpp:
    name: AMD AdaptiveCpp
    strategy:
      fail-fast: false
      matrix:
        build-mode: [Release, Debug, Asserts]
    uses: ./.github/workflows/build-and-test.yml
    with:
      name: AMD AdaptiveCpp
      id: amd-acpp
      image: amd
      image-tag: ${{ inputs.image-tag }}
      scope: ${{ inputs.scope }}
      lfs-key: ${{ inputs.lfs-key }}
      build-mode: ${{ matrix.build-mode }}
      cc: amdclang
      cxx: amdclang++
      fc: flang
      curve: Peano
      sanitizer: none
      gpu-backend: acpp
      gpu-arch: gfx90a
      cpu-device: false

  amd-hip:
    name: AMD HIP
    strategy:
      fail-fast: false
      matrix:
        build-mode: [Release, Debug, Asserts]
    uses: ./.github/workflows/build-and-test.yml
    with:
      name: AMD HIP
      id: amd-hip
      image: amd
      image-tag: ${{ inputs.image-tag }}
      scope: ${{ inputs.scope }}
      lfs-key: ${{ inputs.lfs-key }}
      build-mode: ${{ matrix.build-mode }}
      cc: amdclang
      cxx: amdclang++
      fc: flang
      curve: Peano
      sanitizer: none
      gpu-backend: native
      gpu-arch: gfx90a
      cpu-device: false

  amd-kokkos:
    name: AMD Kokkos
    strategy:
      fail-fast: false
      matrix:
        build-mode: [Release, Debug, Asserts]
    uses: ./.github/workflows/build-and-test.yml
    with:
      name: AMD Kokkos
      id: amd-kokkos
      image: amd
      image-tag: ${{ inputs.image-tag }}
      scope: ${{ inputs.scope }}
      lfs-key: ${{ inputs.lfs-key }}
      build-mode: ${{ matrix.build-mode }}
      cc: amdclang
      cxx: hipcc
      fc: flang
      curve: Peano
      sanitizer: none
      gpu-backend: kokkos
      gpu-arch: gfx90a
      cpu-device: false

  amd-ompt:
    name: AMD OpenMP Target
    strategy:
      fail-fast: false
      matrix:
        build-mode: [Release, Debug, Asserts]
    uses: ./.github/workflows/build-and-test.yml
    with:
      name: AMD OpenMP Target
      id: amd-ompt
      image: amd
      image-tag: ${{ inputs.image-tag }}
      scope: ${{ inputs.scope }}
      lfs-key: ${{ inputs.lfs-key }}
      build-mode: ${{ matrix.build-mode }}
      cc: amdclang
      cxx: amdclang++
      fc: flang
      curve: Peano
      sanitizer: none
      gpu-backend: ompt
      gpu-arch: gfx90a
      cpu-device: false

  gcc-cuda:
    name: GCC CUDA
    strategy:
      fail-fast: false
      matrix:
        build-mode: [Release, Debug, Asserts]
    uses: ./.github/workflows/build-and-test.yml
    with:
      name: GCC CUDA
      id: gcc-cuda
      image: gcc
      image-tag: ${{ inputs.image-tag }}
      scope: ${{ inputs.scope }}
      lfs-key: ${{ inputs.lfs-key }}
      build-mode: ${{ matrix.build-mode }}
      cc: gcc
      cxx: g++
      fc: gfortran
      curve: Peano
      sanitizer: none
      gpu-backend: native
      gpu-arch: sm_75
      cpu-device: false

  gcc-kokkos:
    name: GCC Kokkos
    strategy:
      fail-fast: false
      matrix:
        build-mode: [Release, Debug, Asserts]
    uses: ./.github/workflows/build-and-test.yml
    with:
      name: GCC Kokkos
      id: gcc-kokkos
      image: gcc
      image-tag: ${{ inputs.image-tag }}
      scope: ${{ inputs.scope }}
      lfs-key: ${{ inputs.lfs-key }}
      build-mode: ${{ matrix.build-mode }}
      cc: gcc
      cxx: nvcc_wrapper
      fc: gfortran
      curve: Peano
      sanitizer: none
      gpu-backend: kokkos
      gpu-arch: sm_75
      cpu-device: false

  intel-acpp:
    name: Intel AdaptiveCpp
    strategy:
      fail-fast: false
      matrix:
        build-mode: [Release, Debug, Asserts]
    uses: ./.github/workflows/build-and-test.yml
    with:
      name: Intel AdaptiveCpp
      id: intel-acpp
