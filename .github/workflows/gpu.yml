        build-mode: [Release, Debug, Asserts]
    uses: ./.github/workflows/build-and-test.yml
    with:
      name: LLVM CUDA
      id: llvm-cuda
      image: llvm
      image-tag: ${{ inputs.image-tag }}
      scope: ${{ inputs.scope }}
      lfs-key: ${{ inputs.lfs-key }}
      build-mode: ${{ matrix.build-mode }}
      cc: clang
      cxx: clang++
      fc: gfortran
      curve: Peano
      sanitizer: none
      gpu-backend: native
      gpu-arch: sm_75
      cpu-device: false

  llvm-kokkos:
    name: LLVM Kokkos
    strategy:
      fail-fast: false
      matrix:
        build-mode: [Release, Debug, Asserts]
    uses: ./.github/workflows/build-and-test.yml
    with:
      name: LLVM Kokkos
      id: llvm-kokkos
      image: llvm
      image-tag: ${{ inputs.image-tag }}
      scope: ${{ inputs.scope }}
      lfs-key: ${{ inputs.lfs-key }}
      build-mode: ${{ matrix.build-mode }}
      cc: clang
      cxx: clang++
      fc: gfortran
      curve: Peano
      sanitizer: none
      gpu-backend: kokkos
      gpu-arch: sm_75
      cpu-device: false

  llvm-ompt:
    name: LLVM OpenMP Target
    strategy:
      fail-fast: false
      matrix:
        build-mode: [Release, Debug, Asserts]
    uses: ./.github/workflows/build-and-test.yml
    with:
      name: LLVM OpenMP Target
      id: llvm-ompt
      image: llvm
      image-tag: ${{ inputs.image-tag }}
      scope: ${{ inputs.scope }}
      lfs-key: ${{ inputs.lfs-key }}
      build-mode: ${{ matrix.build-mode }}
      cc: clang
      cxx: clang++
      fc: gfortran
      curve: Peano
      sanitizer: none
      gpu-backend: ompt
      gpu-arch: sm_75
      cpu-device: false
