name: GPU

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gpu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  Images:
    name: Wait for Images
    runs-on: ubuntu-24.04
    outputs:
      amd: ${{ steps.images.outputs.amd }}
      gcc: ${{ steps.images.outputs.gcc }}
      intel: ${{ steps.images.outputs.intel }}
      llvm: ${{ steps.images.outputs.llvm }}
    steps:
      - uses: actions/checkout@v7
      - id: images
        run: >-
          bash .github/scripts/wait-for-images.sh
          ${{ github.event.pull_request.head.repo.fork && '--no-wait' || '' }} amd gcc intel llvm

  LFS:
    name: LFS
    runs-on: ubuntu-24.04
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: key
        run: echo "key=lfs-$(git lfs ls-files --long | sha256sum | cut -c1-16)" >>"${GITHUB_OUTPUT}"
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: ${{ steps.key.outputs.key }}
      - run: git lfs fetch

  Toolchains:
    name: ${{ matrix.toolchain.name }} ${{ matrix.mode }}
    needs: [Images, LFS]
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - { name: AMD AdaptiveCpp, image: amd, cc: amdclang, cxx: amdclang++, backend: acpp, arch: gfx90a }
          - { name: AMD HIP, image: amd, cc: amdclang, cxx: amdclang++, backend: native, arch: gfx90a }
          - { name: AMD Kokkos, image: amd, cc: amdclang, cxx: hipcc, backend: kokkos, arch: gfx90a }
          - { name: AMD OpenMP Target, image: amd, cc: amdclang, cxx: amdclang++, backend: ompt, arch: gfx90a }
          - { name: GCC CUDA, image: gcc, cc: gcc, cxx: g++, backend: native, arch: sm_75 }
          - { name: GCC Kokkos, image: gcc, cc: gcc, cxx: nvcc_wrapper, backend: kokkos, arch: sm_75 }
          - { name: Intel AdaptiveCpp, image: intel, cc: /opt/views/acpp/bin/clang, cxx: /opt/views/acpp/bin/clang++, backend: acpp, arch: spir64 }
          - { name: Intel Kokkos, image: intel, cc: icx, cxx: icpx, backend: kokkos, arch: spir64 }
          - { name: Intel OpenMP Target, image: intel, cc: icx, cxx: icpx, backend: ompt, arch: spir64, cpu-device: LIBOMPTARGET_PLUGIN=OPENCL LIBOMPTARGET_DEVICETYPE=CPU }
          - { name: Intel SYCL, image: intel, cc: icx, cxx: icpx, backend: native, arch: spir64, cpu-device: SYCL_CACHE_PERSISTENT=1 }
          - { name: LLVM AdaptiveCpp, image: llvm, cc: clang, cxx: clang++, backend: acpp, arch: sm_75 }
          - { name: LLVM CUDA, image: llvm, cc: clang, cxx: clang++, backend: native, arch: sm_75 }
          - { name: LLVM Kokkos, image: llvm, cc: clang, cxx: clang++, backend: kokkos, arch: sm_75 }
          - { name: LLVM OpenMP Target, image: llvm, cc: clang, cxx: clang++, backend: ompt, arch: sm_75 }
        mode: [Release, Debug, Asserts]
    uses: ./.github/workflows/toolchain.yml
    with:
      name: ${{ matrix.toolchain.name }}
      image: ${{ needs.Images.outputs[matrix.toolchain.image] }}
      cc: ${{ matrix.toolchain.cc }}
      cxx: ${{ matrix.toolchain.cxx }}
      mode: ${{ matrix.mode }}
      curve: Peano
      cmake-options: -DPEANO_WITH_GPU_BACKEND=${{ matrix.toolchain.backend }} -DPEANO_WITH_GPU_ARCH=${{ matrix.toolchain.arch }}
      environment: ${{ matrix.toolchain.cpu-device || '' }}
      build-only: ${{ !matrix.toolchain.cpu-device || matrix.mode != 'Release' }}
      tutorials: false
      lfs-key: ${{ needs.LFS.outputs.key }}

  GPU:
    name: GPU
    needs: [Images, LFS, Toolchains]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: ${RESULTS}"
          [[ " ${RESULTS} " != *" failure "* && " ${RESULTS} " != *" cancelled "* && " ${RESULTS} " != *" skipped "* ]]
